# quality-gate に計測結果を送る composite action（FR-03-4）。
# 中身は CLI（cli/qg-submit）で、GitHub Actions の文脈（コミット・ブランチ・PR・ランナー種別・実行の URL）を自動で埋める。
# 使い方は docs/operations/ci-submit.md
name: quality-gate-action
description: quality-gate の Ingest API に計測結果（成果物）を送り、判定を依頼する

inputs:
  base-url:
    description: quality-gate の URL
    required: true
  token:
    description: 対象リポジトリの Ingest Token（Secrets から渡す）
    required: true
  artifacts:
    description: |
      送る成果物。1 行に 1 つ、「type パス [component=名前] [scope=head|base] [metadata=JSON]」の形で書く。
      パスはグロブ可（一致したファイルを 1 つずつ送る）。metadata の JSON には空白を含めない。
      例: pit-xml reports/mutations.xml component=backend metadata={"mutationScope":"all"}
    required: false
    default: ''
  config:
    description: 判定に使う .quality-gate.yml（空文字なら送らず、画面で保存した設定で判定される）
    required: false
    default: .quality-gate.yml
  skipped-metrics:
    description: '計測しなかった指標。1 行に 1 つ、「指標 ID 理由」の形で書く（例: M-02 PR では実行しない）'
    required: false
    default: ''
  runner-type:
    description: self-hosted か github-hosted（空なら実行中のランナーから判定する）
    required: false
    default: ''
  base-commit-sha:
    description: 比較元のコミット（40 桁）。空なら、PR ではマージ先との merge-base、push では直前のコミットを使う（取得できなければ送らない）
    required: false
    default: ''
  allow-missing:
    description: 成果物のファイルが無くても送信を続ける（未提出の指標は quality-gate が ERROR にする）
    required: false
    default: 'true'
  wait-seconds:
    description: finalize の後、判定が終わるまで待つ秒数（0 なら待たない）
    required: false
    default: '0'
  fail-on-error:
    description: 送信に失敗したらステップを失敗させる（既定では警告にとどめ、quality-gate の障害で CI を止めない。NFR 10.3）
    required: false
    default: 'false'

outputs:
  run-id:
    description: 作成した Run の ID
    value: ${{ steps.submit.outputs.run-id }}
  status:
    description: wait-seconds を指定した場合の処理状態（EVALUATED / FAILED など）
    value: ${{ steps.submit.outputs.status }}
  verdict:
    description: wait-seconds を指定し、判定が終わった場合の判定結果（PASS / PASS_WITH_WARNINGS / FAIL）
    value: ${{ steps.submit.outputs.verdict }}

runs:
  using: composite
  steps:
    - id: submit
      shell: bash
      env:
        QG_BASE_URL: ${{ inputs.base-url }}
        QG_INGEST_TOKEN: ${{ inputs.token }}
        QG_ARTIFACTS: ${{ inputs.artifacts }}
        QG_CONFIG: ${{ inputs.config }}
        QG_SKIPPED: ${{ inputs.skipped-metrics }}
        QG_RUNNER_TYPE: ${{ inputs.runner-type }}
        QG_BASE_COMMIT: ${{ inputs.base-commit-sha }}
        QG_ALLOW_MISSING: ${{ inputs.allow-missing }}
        QG_WAIT: ${{ inputs.wait-seconds }}
        QG_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        QG_PR_NUMBER: ${{ github.event.pull_request.number }}
        QG_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        QG_PUSH_BEFORE: ${{ github.event.before }}
        QG_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        QG_BRANCH: ${{ github.head_ref || github.ref_name }}
        QG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: '"$GITHUB_ACTION_PATH/submit.sh"'
