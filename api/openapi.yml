openapi: 3.1.0
info:
  description: |
    リポジトリの品質指標を計測・判定・可視化する API。

    認証は 2 経路ある。
    - 参照・操作 API: GitHub OAuth ログイン後のセッション Cookie
    - Ingest API: リポジトリ単位の Ingest Token（書き込み専用）
  license:
    name: Proprietary
  title: quality-gate API
  version: v1
servers:
- description: 同一オリジン
  url: /
tags:
- description: 全リポジトリのサマリ
  name: Dashboard
- description: ログイン中の利用者
  name: Me
- description: CI からの計測結果の取り込み
  name: Ingest
- description: リポジトリ登録・コンポーネント・Ingest Token（管理者のみ）
  name: RepositoryAdmin
- description: 設定の表示・検証結果・版履歴
  name: Config
- description: Run の参照
  name: Runs
- description: 保持期間などのシステム設定（管理者のみ）
  name: Settings
- description: 監査ログの閲覧（管理者のみ）
  name: AuditLogs
- description: 再評価とジョブの運用（管理者のみ）
  name: Operations
- description: 品質レポート（FR-08-4）
  name: Reports
- description: リリース判定（UC-10）
  name: Release
- description: リポジトリ単位の参照
  name: Repositories
- description: 許可リストとロールの管理（管理者のみ）
  name: Users
paths:
  /api/v1/audit-logs:
    get:
      operationId: list_4
      parameters:
      - description: 省略時は to の 30 日前
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: 省略時は現在時刻
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: 操作種別（REPOSITORY_UPDATED など）
        in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
          description: OK
      summary: 監査ログを新しい順に一覧する
      tags:
      - AuditLogs
  /api/v1/dashboard:
    get:
      description: 不合格・注意を先頭に並べる。開く目的が「問題があるか確認すること」であるため。
      operationId: dashboard
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DashboardResponse"
          description: OK
      summary: ダッシュボードを取得する
      tags:
      - Dashboard
  /api/v1/ingest-tokens/{tokenId}:
    delete:
      operationId: revoke
      parameters:
      - in: path
        name: tokenId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Ingest Token を失効させる（即座に無効になる）
      tags:
      - RepositoryAdmin
  /api/v1/jobs/dead:
    get:
      operationId: deadJobs
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeadJobList"
          description: OK
      summary: 恒久的に失敗したジョブを一覧する（新しい順に最大 100 件）
      tags:
      - Operations
  /api/v1/jobs/{jobId}/retry:
    post:
      operationId: retry
      parameters:
      - in: path
        name: jobId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: 恒久的に失敗したジョブを再実行する
      tags:
      - Operations
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: ログイン中の利用者とロールを返す
      tags:
      - Me
  /api/v1/reports:
    get:
      description: 期間内に判定された既定ブランチの Run を、リポジトリごとにまとめる。期間を省略すると今日までの 30 日間。リポジトリを省略すると有効なリポジトリすべて
      operationId: report
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - description: 対象のリポジトリ（複数指定可）
        in: query
        name: repositoryId
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReportResponse"
          description: OK
      summary: 品質レポートを取得する
      tags:
      - Reports
  /api/v1/reports/measurements.csv:
    get:
      description: 1 行が「Run × 指標（コンポーネント・計測条件）」。UTF-8（BOM つき）。条件はレポートと同じ
      operationId: csv
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: repositoryId
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
      summary: 品質レポートの明細を CSV で取得する
      tags:
      - Reports
  /api/v1/repositories:
    get:
      operationId: list_3
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryList"
          description: OK
      summary: 登録済みのリポジトリを一覧する
      tags:
      - Repositories
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryAdminResponse"
          description: OK
      summary: リポジトリを登録する
      tags:
      - RepositoryAdmin
  /api/v1/repositories/{repositoryId}:
    get:
      description: "指標の表は latestRun の Run 詳細（GET /api/v1/runs/{runId}）から描く。判定表の組み立\
        てを 2 箇所に持たないため。"
      operationId: detail
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryDetail"
          description: OK
      summary: リポジトリ詳細を取得する
      tags:
      - Repositories
    patch:
      operationId: update_1
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryAdminResponse"
          description: OK
      summary: リポジトリの設定を更新する（既定ブランチ・PR 計測・有効/無効）
      tags:
      - RepositoryAdmin
  /api/v1/repositories/{repositoryId}/components:
    post:
      operationId: defineComponent
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefineComponentRequest"
        required: true
      responses:
        "200":
          description: OK
      summary: コンポーネントを定義する（同名があれば置き換える）
      tags:
      - RepositoryAdmin
  /api/v1/repositories/{repositoryId}/config:
    get:
      description: 検証エラーは行番号とキーのパス付きで返す。書いた人が自力で直せるように。
      operationId: get
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryConfig"
          description: OK
      summary: 現在の設定と版の履歴、直近の検証結果を取得する
      tags:
      - Config
  /api/v1/repositories/{repositoryId}/ingest-tokens:
    get:
      operationId: tokens
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenList"
          description: OK
      summary: 発行済みの Ingest Token を一覧する（平文は返さない）
      tags:
      - RepositoryAdmin
    post:
      description: token（平文）はこの応答でのみ返す。以後どの API からも取得できない。
      operationId: issue
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTokenRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IssuedToken"
          description: OK
      summary: Ingest Token を発行する
      tags:
      - RepositoryAdmin
  /api/v1/repositories/{repositoryId}/release-report:
    get:
      description: 指定したタグ・コミットで判定済みの Run から、リリースしてよいかと全指標の合否を返す。タグは GitHub API でコミットに解決する。ブランチ名は受け付けない
      operationId: releaseReport
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - description: タグ名、またはコミット SHA（7〜40 桁）
        in: query
        name: ref
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReleaseReportResponse"
          description: OK
      summary: リリース判定を取得する
      tags:
      - Release
  /api/v1/repositories/{repositoryId}/release-report.csv:
    get:
      description: 1 行が 1 指標。判定の前提（コミット・Run・合格ラインの版）と出力日時・出力者を各行に含む。UTF-8（BOM つき）。出力したことを監査ログに残す
      operationId: releaseReportCsv
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: ref
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: リリース判定を CSV で取得する
      tags:
      - Release
  /api/v1/repositories/{repositoryId}/trends:
    get:
      description: 計測環境ごとに系列を分ける。未計測は値 null の点として返し、0 にしない。
      operationId: trends
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - description: 指標 ID（M-01 など）
        in: query
        name: metricId
        required: true
        schema:
          type: string
      - description: 省略時はリポジトリの既定ブランチ
        in: query
        name: branch
        required: false
        schema:
          type: string
      - description: 省略時は to の 30 日前
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: 省略時は現在時刻
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrendResponse"
          description: OK
      summary: 指標の時系列を取得する
      tags:
      - Repositories
  /api/v1/runs:
    get:
      operationId: list_1
      parameters:
      - in: query
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunListResponse"
          description: OK
      summary: Run を新しい順に一覧する
      tags:
      - Runs
    post:
      description: 計測開始時に呼ぶ。同一コミットへの再送信は attempt を増やした新しい Run になる。
      operationId: createRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
          description: OK
      summary: Run を作成する
      tags:
      - Ingest
  /api/v1/runs/{runId}:
    get:
      description: 指標はカテゴリごとにまとめて返す。分類規則を画面に持たせない。
      operationId: detail_1
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunDetailResponse"
          description: OK
      summary: Run の判定結果を取得する
      tags:
      - Runs
  /api/v1/runs/{runId}/artifacts:
    get:
      operationId: list_2
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
          description: OK
      summary: Run に取り込んだ成果物を一覧する
      tags:
      - Runs
    post:
      description: この時点ではパースしない。受領・検証・保存のみを行い、パースは判定ジョブで実施する。
      operationId: uploadArtifact
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: component
        required: false
        schema:
          type: string
      - in: query
        name: scope
        required: false
        schema:
          type: string
      - in: query
        name: metadata
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadArtifactResponse"
          description: OK
      summary: 成果物をアップロードする
      tags:
      - Ingest
  /api/v1/runs/{runId}/artifacts/{artifactId}/content:
    get:
      description: 保持期間を過ぎて実体を削除済みなら 409 ARTIFACTS_DELETED。
      operationId: content
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: artifactId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
      summary: 成果物をダウンロードする
      tags:
      - Runs
  /api/v1/runs/{runId}/finalize:
    post:
      description: 判定は非同期で開始される。CI は判定の完了を待たずに次へ進んでよい。
      operationId: finalizeRun
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalizeResponse"
          description: OK
      summary: 取り込み完了を宣言する
      tags:
      - Ingest
  /api/v1/runs/{runId}/findings:
    get:
      description: state を省略すると新規・継続・初回のみを返す。解消済みは明示指定が必要。
      operationId: findings
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - description: 指標 ID。複数指定可
        in: query
        name: metricId
        required: false
        schema:
          type: array
          items:
            type: string
      - description: 省略時は NEW / CONTINUING / INITIAL
        in: query
        name: state
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: severity
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FindingListResponse"
          description: OK
      summary: Run に紐づく違反を一覧する
      tags:
      - Runs
  /api/v1/runs/{runId}/reevaluate:
    post:
      description: 保存済みの成果物と、その Run とともに送られた設定を読み直して判定し直す。成果物が保持期間を過ぎて削除されていれば 409
        ARTIFACTS_DELETED。
      operationId: reevaluate
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReevaluateResponse"
          description: OK
      summary: Run を再評価する
      tags:
      - Operations
  /api/v1/runs/{runId}/status:
    get:
      operationId: status
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunStatusResponse"
          description: OK
      summary: 処理状態と判定結果を取得する（CI のポーリング用）
      tags:
      - Ingest
  /api/v1/settings/retention:
    get:
      operationId: retention
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RetentionSettings"
          description: OK
      summary: データ保持期間を取得する
      tags:
      - Settings
    put:
      description: 翌日の保持期間バッチから効く。短くすると古いデータが削除される。
      operationId: updateRetention
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionSettings"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RetentionSettings"
          description: OK
      summary: データ保持期間を変更する
      tags:
      - Settings
  /api/v1/users:
    get:
      operationId: list
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserList"
          description: OK
      summary: 許可リストの利用者を一覧する
      tags:
      - Users
    post:
      description: GitHub ログイン名の実在は確認しない。存在しない名前はログインできないだけで害がない。
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      summary: 許可リストに利用者を追加する
      tags:
      - Users
  /api/v1/users/{userId}:
    patch:
      description: 自分自身の降格・無効化と、有効な管理者が 0 人になる変更は 409 ADMIN_REQUIRED。
      operationId: update
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      summary: ロールの変更・無効化
      tags:
      - Users
components:
  schemas:
    ArtifactItem:
      type: object
      properties:
        artifactId:
          type: string
          format: uuid
        component:
          type:
          - string
          - "null"
        deleted:
          type: boolean
          description: 保持期間を過ぎて実体を削除済みなら true。ダウンロードできない
        filename:
          type: string
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
        type:
          type: string
        uploadedAt:
          type: string
          format: date-time
      required:
      - artifactId
      - component
      - deleted
      - filename
      - sha256
      - sizeBytes
      - type
      - uploadedAt
    ArtifactListResponse:
      type: object
      description: Run に取り込んだ成果物の一覧（FR-07-5）
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactItem"
      required:
      - items
    AuditLogItem:
      type: object
      properties:
        action:
          type: string
        actorLogin:
          type:
          - string
          - "null"
          description: 日次バッチの操作は system
        after:
          type:
          - object
          - "null"
          additionalProperties: {}
          description: 変更後の値
        auditLogId:
          type: string
          format: uuid
        before:
          type:
          - object
          - "null"
          additionalProperties: {}
