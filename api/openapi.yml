    SkippedMetricRequest:
      type: object
      description: スキップの申告。申告のない未提出は ERROR として扱われる。
      properties:
        metricId:
          type: string
          example: M-02
          minLength: 1
          pattern: "^M-\\d{2}$"
        reason:
          type: string
          description: なぜ計測しなかったか。Run 詳細にそのまま表示される
          example: PR の計測では PIT を実行しない
          minLength: 1
      required:
      - metricId
      - reason
    SkippedMetricView:
      type: object
      description: CI からのスキップ申告。受理されなかった申告も残す
      properties:
        accepted:
          type: boolean
          description: 設定で許容されているか。false なら当該指標は ERROR
        metricId:
          type: string
        name:
          type: string
        reason:
          type: string
      required:
      - accepted
      - metricId
      - name
      - reason
    TrendPoint:
      type: object
      properties:
        commitSha:
          type: string
        measuredAt:
          type: string
          format: date-time
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PASS
          - WARN
          - FAIL
          - SKIP
          - ERROR
          - NOT_APPLICABLE
        value:
          type:
          - number
          - "null"
          description: 実測値。未計測は null。0 を返さない。0 を返すと、グラフ上で「極めて良い値」に見えてしまう
      required:
      - commitSha
      - measuredAt
      - runId
      - status
      - value
    TrendResponse:
      type: object
      description: 指標の時系列。計測環境ごとに系列を分ける
      properties:
        branch:
          type: string
        from:
          type: string
          format: date-time
        metricId:
          type: string
        name:
          type: string
        series:
          type: array
          items:
            $ref: "#/components/schemas/TrendSeries"
        threshold:
          type:
          - object
          - "null"
          additionalProperties: {}
          description: 重畳表示する合格ライン。期間内で最後に適用された値。期間中にしきい値が変わった場合は thresholdChanged
            が true になる
        thresholdChanged:
          type: boolean
          description: 期間内でしきい値が変わったか。true のとき、1 本の線では過去の判定を説明できない
        to:
          type: string
          format: date-time
        unit:
          type:
          - string
          - "null"
      required:
      - branch
      - from
      - metricId
      - name
      - series
      - threshold
      - thresholdChanged
      - to
      - unit
    TrendSeries:
      type: object
      properties:
        colorIndex:
          type: integer
          format: int32
        componentName:
          type:
          - string
          - "null"
        label:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        seriesId:
          type: string
      required:
      - colorIndex
      - componentName
      - label
      - points
      - seriesId
    UpdateRepositoryRequest:
      type: object
      properties:
        defaultBranch:
          type:
          - string
          - "null"
          maxLength: 255
          minLength: 1
        enabled:
          type:
          - boolean
          - "null"
          description: false で無効化（ダッシュボードから外れ、取り込みも拒否される）
    UpdateUserRequest:
      type: object
      properties:
        role:
          type:
          - string
          - "null"
          enum:
          - ADMIN
          - VIEWER
        status:
          type:
          - string
          - "null"
          enum:
          - ACTIVE
          - DISABLED
    UploadArtifactResponse:
      type: object
      properties:
        artifactId:
          type: string
          format: uuid
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
    UserList:
      type: object
      description: 利用者の一覧
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
      required:
      - items
    UserResponse:
      type: object
      description: 許可リストの利用者。ここに無い GitHub ユーザーはログインできない
      properties:
        avatarUrl:
          type:
          - string
          - "null"
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - "null"
          description: 初回ログインまでは null
        githubLogin:
          type: string
        lastLoginAt:
          type:
          - string
          - "null"
          format: date-time
          description: 一度もログインしていなければ null
        role:
          type: string
          enum:
          - ADMIN
          - VIEWER
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        userId:
          type: string
          format: uuid
      required:
      - avatarUrl
      - createdAt
      - displayName
      - githubLogin
      - lastLoginAt
      - role
      - status
      - userId
    ValidationErrorItem:
      type: object
      properties:
        line:
          type:
          - integer
          - "null"
          format: int32
          description: 1 始まりの行番号
        message:
          type: string
        path:
          type: string
      required:
      - line
      - message
      - path
