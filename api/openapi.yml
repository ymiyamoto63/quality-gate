openapi: 3.1.0
info:
  description: |
    リポジトリの品質指標を計測・判定・可視化する API。

    認証は 2 経路ある。
    - 参照 API: 共有のアカウントでログインした後のセッション Cookie
    - Ingest API: 収集ランナー用の Ingest Token（書き込み専用）
  license:
    name: Proprietary
  title: quality-gate API
  version: v1
servers:
- description: 同一オリジン
  url: /
tags:
- description: 収集ランナーからの計測結果の取り込み
  name: Ingest
- description: リリース判定
  name: Release
- description: ログインの状態
  name: Me
paths:
  /api/v1/me:
    get:
      description: 未ログインなら 401
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: ログイン中の利用者を返す
      tags:
      - Me
  /api/v1/release:
    get:
      description: 指定したタグ・コミットで判定済みの計測から、リリースしてよいかと全指標の合否を返す。指定が無ければ最新の判定済みの計測を使う。ブランチ名は受け付けない
      operationId: releaseReport
      parameters:
      - description: タグ名、またはコミット SHA（7〜40 桁）。省略すると最新
        in: query
        name: ref
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReleaseReportResponse"
          description: OK
      summary: リリース判定を取得する
      tags:
      - Release
  /api/v1/release/history:
    get:
      description: 判定済みの計測を新しい順に最大 50 件（同じコミットは最後の判定だけ）
      operationId: history
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReleaseHistoryResponse"
          description: OK
      summary: 判定の履歴を取得する
      tags:
      - Release
  /api/v1/runs:
    post:
      description: 計測開始時に呼ぶ。同一コミットへの再送信は attempt を増やした新しい Run になる。
      operationId: createRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
          description: Created
      summary: Run を作成する
      tags:
      - Ingest
  /api/v1/runs/{runId}/artifacts:
    post:
      description: この時点ではパースしない。受領・検証・保存のみを行い、パースは確定時の判定で行う。
      operationId: uploadArtifact
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: component
        required: false
        schema:
          type: string
      - in: query
        name: metadata
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "202":
          description: Accepted
      summary: 成果物をアップロードする
      tags:
      - Ingest
  /api/v1/runs/{runId}/finalize:
    post:
      description: その場で判定し、判定結果を返す。判定に失敗した場合も 200 で、status が FAILED になる（理由は errorCode
        とサーバのログで確かめる）。
      operationId: finalizeRun
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalizeResponse"
          description: OK
      summary: 取り込み完了を宣言し、判定する
      tags:
      - Ingest
components:
  schemas:
    CreateRunRequest:
      type: object
      description: Run の作成要求。収集ランナーが計測結果を送る前に送信する。
      properties:
        baseCommitSha:
          type: string
          description: 差分計測の比較基準（収集ランナーが求めて送る）。省略すると比較元なしで判定する
          pattern: "^[0-9a-f]{40}$"
        branch:
          type: string
          minLength: 1
        ciRunUrl:
          type: string
        commitSha:
          type: string
          description: 計測対象のコミット SHA（40 桁）
          minLength: 1
          pattern: "^[0-9a-f]{40}$"
        measuredAt:
          type: string
          format: date-time
        repository:
          type: string
          description: owner/name 形式。quality-gate の計測対象（QG_REPOSITORY）と一致しなければ拒否する
          example: ymiyamoto63/quality-gate
          minLength: 1
          pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"
        tags:
          type: array
          description: 計測したコミットを指すタグ（収集ランナーが対象リポジトリの履歴から求める）。リリース判定でタグをコミットに解決するのに使う
          items:
            type: string
            maxLength: 255
            minLength: 0
            pattern: "^(?!/)(?!.*\\.\\.)(?!.*/$)[^\\s\\p{Cntrl}~^:?*\\[\\\\]+$"
          maxItems: 100
          minItems: 0
      required:
      - branch
      - commitSha
      - measuredAt
      - repository
    CreateRunResponse:
      type: object
      properties:
        runId:
          type: string
          format: uuid
    FinalizeResponse:
      type: object
      description: 確定と判定の結果。収集ランナーはこれをログに出す
      properties:
        detailUrl:
          type: string
          description: リリース判定の画面（このコミット）への直リンク
        errorCode:
          type: string
          description: 処理失敗の理由のコード。判定済みなら null
        status:
          type: string
          description: EVALUATED（判定済み）か FAILED（処理失敗）
          enum:
          - CREATED
          - UPLOADING
          - FINALIZED
          - PROCESSING
          - EVALUATED
          - FAILED
        verdict:
          type: string
          description: 判定結果。処理失敗なら null
          enum:
          - PASS
          - FAIL
    MeResponse:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    ReleaseCounts:
      type: object
      description: 合否に使った指標の件数
      properties:
        failed:
          type: integer
          format: int32
        judged:
          type: integer
          format: int32
        passed:
          type: integer
          format: int32
      required:
      - failed
      - judged
      - passed
    ReleaseFinding:
      type: object
      properties:
        location:
          type:
          - string
          - "null"
          description: ファイルと行（backend/src/Foo.java:42 など）
        title:
          type: string
        url:
          type:
          - string
          - "null"
          description: GitHub の該当箇所
      required:
      - location
      - title
      - url
    ReleaseGuide:
      type: object
      properties:
        basis:
          type: string
        basisLabel:
          type: string
          description: 根拠の種類の表示名（外部基準 など）
        definition:
          type: string
          description: 技術的な定義
        metricId:
          type: string
        name:
          type: string
        rationale:
          type: string
          description: 既定の合格ラインにした理由
        risk:
          type: string
          description: 不合格のまま出すと何が起きるか
        summary:
          type: string
          description: 何を見る指標か
        tools:
          type: string
          description: 計測に使うライブラリ・ソフトウェア
      required:
      - basis
      - basisLabel
      - definition
      - metricId
      - name
      - rationale
      - risk
      - summary
      - tools
    ReleaseHistoryItem:
      type: object
      properties:
        commitSha:
          type: string
        measuredAt:
          type: string
          format: date-time
        ref:
          type: string
          description: リリース判定を開くときの指定（タグがあればタグ、無ければコミット SHA）
        tags:
          type: array
          description: 計測したコミットを指すタグ
          items:
            type: string
        verdict:
          type: string
          enum:
          - PASS
          - FAIL
      required:
      - commitSha
      - measuredAt
      - ref
      - tags
      - verdict
    ReleaseHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseHistoryItem"
      required:
      - items
    ReleaseMetric:
      type: object
      properties:
        componentName:
          type:
          - string
          - "null"
        findingCount:
          type: integer
          format: int32
          description: 不合格のときの違反の総数。合格なら 0
        findings:
          type: array
          description: 不合格のときの主な違反（深刻な順に最大 10 件）。合格なら空
          items:
            $ref: "#/components/schemas/ReleaseFinding"
        metricId:
          type: string
        name:
          type: string
        reason:
          type:
          - string
          - "null"
        status:
          type: string
          description: PASS（合格）/ FAIL（不合格）/ ERROR（計測できなかった。不合格として扱う）
          enum:
          - PASS
          - FAIL
          - ERROR
          - NOT_APPLICABLE
        threshold:
          type:
          - string
          - "null"
          description: 合格ラインを表示用にした文字列（≥ 75% など）
        unit:
          type:
          - string
          - "null"
        value:
          type:
          - number
          - "null"
          description: 実測値。計測エラーは null
        variantLabel:
          type:
          - string
          - "null"
      required:
      - componentName
      - findingCount
      - findings
      - metricId
      - name
      - reason
      - status
      - threshold
      - unit
      - value
      - variantLabel
    ReleaseReportResponse:
      type: object
      description: リリース判定。判定済みの計測（Run）から組み立てる
      properties:
        commitSha:
          type:
          - string
          - "null"
          description: 判定したコミット。計測が 1 件も無ければ null
        commitUrl:
          type:
          - string
          - "null"
        counts:
          $ref: "#/components/schemas/ReleaseCounts"
        decision:
          type: string
          enum:
          - RELEASABLE
          - NOT_RELEASABLE
          - NOT_MEASURED
        decisionReason:
          type: string
          description: 判定の理由（1 文）。文言はサーバが持ち、画面はそのまま表示する
        guides:
          type: array
          description: 結果に現れた指標の説明（指標 ID ごとに 1 件、metrics と同じ並び）
          items:
            $ref: "#/components/schemas/ReleaseGuide"
        metrics:
          type: array
          description: 指標ごとの結果。不合格を先に並べる。合否に使わない対象外の結果は含めない
          items:
            $ref: "#/components/schemas/ReleaseMetric"
        repositoryFullName:
          type: string
        run:
          type: "null"
          $ref: "#/components/schemas/ReleaseRun"
          description: 判定に使った計測。未計測なら null
      required:
      - commitSha
      - commitUrl
      - counts
      - decision
      - decisionReason
      - guides
      - metrics
      - repositoryFullName
      - run
    ReleaseRun:
      type: object
      properties:
        baseCommitSha:
          type:
          - string
          - "null"
          description: 比較元のコミット。破壊的変更・スキップの増加はここからの差で数える。タグで計測したときは前のタグ
        ciRunUrl:
          type:
          - string
          - "null"
          description: 計測したワークフローの実行 URL
        measuredAt:
          type: string
          format: date-time
        tags:
          type: array
          description: 計測したコミットを指すタグ
          items:
            type: string
      required:
      - baseCommitSha
      - ciRunUrl
      - measuredAt
      - tags
