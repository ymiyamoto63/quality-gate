openapi: 3.1.0
info:
  description: |
    リポジトリの品質指標を計測・判定・可視化する API。

    認証は 2 経路ある。
    - 参照・操作 API: GitHub OAuth ログイン後のセッション Cookie
    - Ingest API: リポジトリ単位の Ingest Token（書き込み専用）
  license:
    name: Proprietary
  title: quality-gate API
  version: v1
servers:
- description: 同一オリジン
  url: /
tags:
- description: 全リポジトリのサマリ
  name: Dashboard
- description: Run の参照
  name: Runs
- description: ログイン中の利用者
  name: Me
- description: CI からの計測結果の取り込み
  name: Ingest
- description: リポジトリ単位の参照
  name: Repositories
paths:
  /api/v1/dashboard:
    get:
      description: 不合格・注意を先頭に並べる。開く目的が「問題があるか確認すること」であるため。
      operationId: dashboard
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DashboardResponse"
          description: OK
      summary: ダッシュボードを取得する
      tags:
      - Dashboard
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: ログイン中の利用者とロールを返す
      tags:
      - Me
  /api/v1/repositories/{repositoryId}/trends:
    get:
      description: 計測環境ごとに系列を分ける。未計測は値 null の点として返し、0 にしない。
      operationId: trends
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - description: 指標 ID（M-01 など）
        in: query
        name: metricId
        required: true
        schema:
          type: string
      - description: 省略時はリポジトリの既定ブランチ
        in: query
        name: branch
        required: false
        schema:
          type: string
      - description: 省略時は to の 30 日前
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: 省略時は現在時刻
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrendResponse"
          description: OK
      summary: 指標の時系列を取得する
      tags:
      - Repositories
  /api/v1/runs:
    get:
      operationId: list
      parameters:
      - in: query
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunListResponse"
          description: OK
      summary: Run を新しい順に一覧する
      tags:
      - Runs
    post:
      description: 計測開始時に呼ぶ。同一コミットへの再送信は attempt を増やした新しい Run になる。
      operationId: createRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
          description: OK
      summary: Run を作成する
      tags:
      - Ingest
  /api/v1/runs/{runId}:
    get:
      description: 指標はカテゴリごとにまとめて返す。分類規則を画面に持たせない。
      operationId: detail
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunDetailResponse"
          description: OK
      summary: Run の判定結果を取得する
      tags:
      - Runs
  /api/v1/runs/{runId}/artifacts:
    post:
      description: この時点ではパースしない。受領・検証・保存のみを行い、パースは判定ジョブで実施する。
      operationId: uploadArtifact
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: component
        required: false
        schema:
          type: string
      - in: query
        name: scope
        required: false
        schema:
          type: string
      - in: query
        name: metadata
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadArtifactResponse"
          description: OK
      summary: 成果物をアップロードする
      tags:
      - Ingest
  /api/v1/runs/{runId}/finalize:
    post:
      description: 判定は非同期で開始される。CI は判定の完了を待たずに次へ進んでよい。
      operationId: finalizeRun
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalizeResponse"
          description: OK
      summary: 取り込み完了を宣言する
      tags:
      - Ingest
  /api/v1/runs/{runId}/findings:
    get:
      description: state を省略すると新規・継続・初回のみを返す。解消済みは明示指定が必要。
      operationId: findings
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - description: 指標 ID。複数指定可
        in: query
        name: metricId
        required: false
        schema:
          type: array
          items:
            type: string
      - description: 省略時は NEW / CONTINUING / INITIAL
        in: query
        name: state
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: severity
        required: false
        schema:
          type: array
          items:
            type: string
      - description: true=免除中のみ / false=免除でないもののみ / 省略=両方
        in: query
        name: waived
        required: false
        schema:
          type: boolean
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FindingListResponse"
          description: OK
      summary: Run に紐づく違反を一覧する
      tags:
      - Runs
  /api/v1/runs/{runId}/status:
    get:
      operationId: status
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunStatusResponse"
          description: OK
      summary: 処理状態と判定結果を取得する（CI のポーリング用）
      tags:
      - Ingest
components:
  schemas:
    Alert:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        repositoryId:
          type: string
          format: uuid
    CreateRunRequest:
      type: object
      description: Run の作成要求。CI が計測開始時に送信する。
      properties:
        baseCommitSha:
          type: string
          description: 差分計測の比較基準。省略時は quality-gate が merge-base を解決する
          pattern: "^[0-9a-f]{40}$"
        branch:
          type: string
          minLength: 1
        ciRunUrl:
          type: string
        commitSha:
          type: string
          description: 計測対象のコミット SHA（40 桁）
          minLength: 1
          pattern: "^[0-9a-f]{40}$"
        measuredAt:
          type: string
          format: date-time
        pullRequestNumber:
          type: integer
          format: int32
        repository:
          type: string
          description: owner/name 形式。Ingest Token の発行元と一致する必要がある
          example: ymiyamoto63/quality-gate
          minLength: 1
          pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"
        runnerType:
          type: string
          description: 計測を実行したランナー種別。性能指標の判定可否がこれで決まる
          enum:
          - self-hosted
          - github-hosted
        skippedMetrics:
          type: array
          description: CI が実行しなかった指標の申告。省略時は全指標を計測したものとして扱う
          items:
            $ref: "#/components/schemas/SkippedMetricRequest"
        triggeredBy:
          type: string
          minLength: 1
      required:
      - branch
      - commitSha
      - measuredAt
      - repository
      - runnerType
      - triggeredBy
    CreateRunResponse:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        detailUrl:
          type: string
          description: Run 詳細画面への直リンク。CI のログに出して、不合格時にその場から飛べるようにする
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - FINALIZED
          - PROCESSING
          - EVALUATED
          - FAILED
          - ABANDONED
    DashboardResponse:
      type: object
      description: ダッシュボード。repository_summaries を読むだけで応答する。
      properties:
        alerts:
          type: array
          description: 計測途絶などの警告。画面側で判定させず、サーバが返す
          items:
            $ref: "#/components/schemas/Alert"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryCard"
    FinalizeResponse:
      type: object
      properties:
        detailUrl:
          type: string
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - FINALIZED
          - PROCESSING
          - EVALUATED
          - FAILED
          - ABANDONED
    FindingItem:
      type: object
      properties:
        componentName:
          type:
          - string
          - "null"
        detail:
          type: object
          additionalProperties: {}
          description: ツール固有の付加情報。無ければ空オブジェクト
        filePath:
          type:
          - string
          - "null"
        findingId:
          type: string
          format: uuid
        line:
          type:
          - integer
          - "null"
          format: int32
        metricId:
          type: string
        metricName:
          type: string
        ruleId:
          type:
          - string
          - "null"
        severity:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          - INFO
        sourceUrl:
          type:
          - string
          - "null"
          description: 該当箇所へのリンク。ホスティング先の URL 形式はサーバが持つ。パスを持たない違反（依存パッケージの脆弱性など）では
            null
        state:
          type: string
          enum:
          - NEW
          - CONTINUING
          - RESOLVED
          - INITIAL
        title:
          type: string
        waiver:
          type: "null"
          $ref: "#/components/schemas/Waiver"
          description: 免除中の場合のみ。免除は解決ではないため画面では薄く表示しない。免除機能（FR-09）は未実装のため、現時点では常に
            null
      required:
      - componentName
      - detail
      - filePath
      - findingId
      - line
      - metricId
      - metricName
      - ruleId
      - severity
      - sourceUrl
      - state
      - title
      - waiver
    FindingListResponse:
      type: object
      description: Run に紐づく違反の一覧
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/FindingItem"
        nextCursor:
          type:
          - string
          - "null"
          description: 次ページのカーソル。最終ページでは null
        totalCount:
          type: integer
          format: int64
          description: 絞り込み後の総件数。件数表示と「全部見た」の判断に使う
      required:
      - hasMore
      - items
      - nextCursor
      - totalCount
    Freshness:
      type: object
      description: データの鮮度。基準日数は設定値のため、判定結果をサーバが返す。
      properties:
        lastFullMeasuredAt:
          type: string
          format: date-time
        lastMeasuredAt:
          type: string
          format: date-time
        staleFullMeasurement:
          type: boolean
        staleMeasurement:
          type: boolean
    GateConfigRef:
      type: object
      description: 判定に使った設定版。しきい値を変えても過去の Run は当時の判定のまま
      properties:
        gateConfigId:
          type: string
          format: uuid
        sourceCommitSha:
          type:
          - string
          - "null"
        sourceType:
          type:
          - string
          - "null"
        version:
          type:
          - integer
          - "null"
          format: int32
      required:
      - gateConfigId
      - sourceCommitSha
      - sourceType
      - version
    LatestRun:
      type: object
      properties:
        completeness:
          type: string
          enum:
          - FULL
          - PARTIAL
        measuredAt:
          type: string
          format: date-time
        runId:
          type: string
          format: uuid
        verdict:
          type: string
          description: 判定結果。未判定なら null
          enum:
          - PASS
          - PASS_WITH_WARNINGS
          - FAIL
    MeResponse:
      type: object
      description: ログイン中の利用者。フロントエンドはこの role で表示を制御する（防御は API 側）。
      properties:
        avatarUrl:
          type: string
        displayName:
          type: string
        githubLogin:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - VIEWER
        userId:
          type: string
          format: uuid
    RepositoryCard:
      type: object
      properties:
        activeWaiverCount:
          type: integer
          format: int32
        freshness:
          $ref: "#/components/schemas/Freshness"
        fullName:
          type: string
        latestRun:
          $ref: "#/components/schemas/LatestRun"
        openCriticalCount:
          type: integer
          format: int32
        openHighCount:
          type: integer
          format: int32
        repositoryId:
          type: string
          format: uuid
    RepositoryRef:
      type: object
      properties:
        fullName:
          type:
          - string
          - "null"
        repositoryId:
          type: string
          format: uuid
      required:
      - fullName
      - repositoryId
    RunCategory:
      type: object
      properties:
        category:
          type: string
          description: カテゴリ名（機能テスト など）
        expandByDefault:
          type: boolean
          description: 不合格・注意を含むカテゴリは画面の初期状態で展開する
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/RunMetric"
        status:
          type: string
          description: カテゴリ内で最も重いステータス
          enum:
          - PASS
          - WARN
          - FAIL
          - SKIP
          - REFERENCE
          - ERROR
      required:
      - category
      - expandByDefault
      - metrics
      - status
    RunDetailResponse:
      type: object
      description: Run 1 件の判定結果
      properties:
        artifactCount:
          type: integer
          format: int32
        attempt:
          type: integer
          format: int32
        baseCommitSha:
          type:
          - string
          - "null"
        baselineRunId:
          type:
          - string
          - "null"
          format: uuid
          description: 差分算出に使った比較対象 Run。初回 Run では null
        branch:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/RunCategory"
        ciRunUrl:
          type:
          - string
          - "null"
        commitSha:
          type: string
        commitUrl:
          type:
          - string
          - "null"
          description: コミットへのリンク。URL の組み立てはサーバが持つ
        completeness:
          type:
          - string
          - "null"
          enum:
          - FULL
          - PARTIAL
        evaluatedAt:
          type:
          - string
          - "null"
          format: date-time
        failure:
          type: "null"
          $ref: "#/components/schemas/RunFailure"
          description: 処理そのものが失敗した場合のみ。判定結果 FAIL とは別物
        findingSummary:
          $ref: "#/components/schemas/RunFindingSummary"
        gateConfig:
          type: "null"
          $ref: "#/components/schemas/GateConfigRef"
          description: 判定に使った設定版。既定値で判定した場合は null
        measuredAt:
          type: string
          format: date-time
        pullRequestNumber:
          type:
          - integer
          - "null"
          format: int32
        repository:
          $ref: "#/components/schemas/RepositoryRef"
        runId:
          type: string
          format: uuid
        runnerType:
          type: string
          enum:
          - self-hosted
          - github-hosted
        skippedMetrics:
          type: array
          items:
            $ref: "#/components/schemas/SkippedMetricView"
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - FINALIZED
          - PROCESSING
          - EVALUATED
          - FAILED
          - ABANDONED
        verdict:
          type:
          - string
          - "null"
          description: 判定結果。判定前・処理失敗では null
          enum:
          - PASS
          - PASS_WITH_WARNINGS
          - FAIL
      required:
      - artifactCount
      - attempt
      - baseCommitSha
      - baselineRunId
      - branch
      - categories
      - ciRunUrl
      - commitSha
      - commitUrl
      - completeness
      - evaluatedAt
      - failure
      - findingSummary
      - gateConfig
      - measuredAt
      - pullRequestNumber
      - repository
      - runId
      - runnerType
      - skippedMetrics
      - status
      - verdict
    RunFailure:
      type: object
      description: 処理失敗の内容。errorCode で分岐し、hint で対処を示す
      properties:
        detail:
          type:
          - string
          - "null"
        errorCode:
          type:
          - string
          - "null"
        hint:
          type: string
        title:
          type: string
      required:
      - detail
      - errorCode
      - hint
      - title
    RunFindingSummary:
      type: object
      description: 違反の内訳。解消（RESOLVED）も件数に含めて「直った数」を示す
      properties:
        continuing:
          type: integer
          format: int64
        initial:
          type: integer
          format: int64
        newCount:
          type: integer
          format: int64
        resolved:
          type: integer
          format: int64
        waived:
          type: integer
          format: int64
      required:
      - continuing
      - initial
      - newCount
      - resolved
      - waived
    RunListResponse:
      type: object
      description: Run の一覧。新しいものから返す
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - hasMore
      - items
      - nextCursor
    RunMetric:
      type: object
      properties:
        componentName:
          type:
          - string
          - "null"
          description: コンポーネント名（backend / frontend）。全体値の指標では null
        delta:
          type:
          - number
          - "null"
          description: 前回比。前回値か今回値が無ければ null
        deltaImproved:
          type:
          - boolean
          - "null"
          description: 差分が良い方向か。null は前回比なし
        detail:
          type:
          - object
          - "null"
          additionalProperties: {}
        findingCount:
          type: integer
          format: int64
          description: この指標に紐づく未解消の違反件数
        metricId:
          type: string
        name:
          type: string
        previousValue:
          type:
          - number
          - "null"
        reason:
          type:
          - string
          - "null"
          description: 判定理由。文言はサーバが持ち、画面はそのまま表示する
        status:
          type: string
          enum:
          - PASS
          - WARN
          - FAIL
          - SKIP
          - REFERENCE
          - ERROR
        threshold:
          type:
          - object
          - "null"
          additionalProperties: {}
          description: "合格ライン。例: {\"operator\": \">=\", \"value\": 75}"
        unit:
          type:
          - string
          - "null"
        value:
          type:
          - number
          - "null"
          description: 実測値。未計測は null。0 は「計測して 0 だった」を意味し別物
      required:
      - componentName
      - delta
      - deltaImproved
      - detail
      - findingCount
      - metricId
      - name
      - previousValue
      - reason
      - status
      - threshold
      - unit
      - value
    RunStatusResponse:
      type: object
      description: CI がポーリングするための軽量な状態応答。
      properties:
        completeness:
          type: string
          enum:
          - FULL
          - PARTIAL
        detailUrl:
          type: string
        errorCode:
          type: string
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - FINALIZED
          - PROCESSING
          - EVALUATED
          - FAILED
          - ABANDONED
        verdict:
          type: string
          description: 判定結果。未判定の場合は null
          enum:
          - PASS
          - PASS_WITH_WARNINGS
          - FAIL
    RunSummary:
      type: object
      properties:
        branch:
          type: string
        commitSha:
          type: string
        completeness:
          type:
          - string
          - "null"
          enum:
          - FULL
          - PARTIAL
        evaluatedAt:
          type:
          - string
          - "null"
          format: date-time
        measuredAt:
          type: string
          format: date-time
        pullRequestNumber:
          type:
          - integer
          - "null"
          format: int32
        runId:
          type: string
          format: uuid
        runnerType:
          type: string
          enum:
          - self-hosted
          - github-hosted
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - FINALIZED
          - PROCESSING
          - EVALUATED
          - FAILED
          - ABANDONED
        verdict:
          type:
          - string
          - "null"
          enum:
          - PASS
          - PASS_WITH_WARNINGS
          - FAIL
      required:
      - branch
      - commitSha
      - completeness
      - evaluatedAt
      - measuredAt
      - pullRequestNumber
      - runId
      - runnerType
      - status
      - verdict
    SkippedMetricRequest:
      type: object
      description: スキップの申告。申告のない未提出は ERROR として扱われる。
      properties:
        metricId:
          type: string
          example: M-02
          minLength: 1
          pattern: "^M-\\d{2}$"
        reason:
          type: string
          description: なぜ計測しなかったか。Run 詳細にそのまま表示される
          example: GitHub ホストランナーのため PIT を実行しない
          minLength: 1
      required:
      - metricId
      - reason
    SkippedMetricView:
      type: object
      description: CI からのスキップ申告。受理されなかった申告も残す
      properties:
        accepted:
          type: boolean
          description: 設定で許容されているか。false なら当該指標は ERROR
        metricId:
          type: string
        name:
          type: string
        reason:
          type: string
      required:
      - accepted
      - metricId
      - name
      - reason
    TrendPoint:
      type: object
      properties:
        commitSha:
          type: string
        measuredAt:
          type: string
          format: date-time
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PASS
          - WARN
          - FAIL
          - SKIP
          - REFERENCE
          - ERROR
        value:
          type:
          - number
          - "null"
          description: 実測値。未計測は null。0 を返さない。0 を返すと、グラフ上で「極めて良い値」に見えてしまう
      required:
      - commitSha
      - measuredAt
      - runId
      - status
      - value
    TrendResponse:
      type: object
      description: 指標の時系列。計測環境ごとに系列を分ける
      properties:
        branch:
          type: string
        from:
          type: string
          format: date-time
        metricId:
          type: string
        name:
          type: string
        series:
          type: array
          items:
            $ref: "#/components/schemas/TrendSeries"
        threshold:
          type:
          - object
          - "null"
          additionalProperties: {}
          description: 重畳表示する合格ライン。期間内で最後に適用された値。期間中にしきい値が変わった場合は thresholdChanged
            が true になる
        thresholdChanged:
          type: boolean
          description: 期間内でしきい値が変わったか。true のとき、1 本の線では過去の判定を説明できない
        to:
          type: string
          format: date-time
        unit:
          type:
          - string
          - "null"
      required:
      - branch
      - from
      - metricId
      - name
      - series
      - threshold
      - thresholdChanged
      - to
      - unit
    TrendSeries:
      type: object
      properties:
        colorIndex:
          type: integer
          format: int32
        componentName:
          type:
          - string
          - "null"
        judged:
          type: boolean
        label:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        seriesId:
          type: string
      required:
      - colorIndex
      - componentName
      - judged
      - label
      - points
      - seriesId
    UploadArtifactResponse:
      type: object
      properties:
        artifactId:
          type: string
          format: uuid
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
    Waiver:
      type: object
      properties:
        expiresOn:
          type: string
          format: date
        reason:
          type: string
        waiverId:
          type: string
          format: uuid
      required:
      - expiresOn
      - reason
      - waiverId
