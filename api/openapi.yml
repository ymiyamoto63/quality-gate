openapi: 3.1.0
info:
  description: |
    リポジトリの品質指標を計測・判定・可視化する API。

    認証は 2 経路ある。
    - 参照・操作 API: GitHub OAuth ログイン後のセッション Cookie
    - Ingest API: リポジトリ単位の Ingest Token（書き込み専用）
  license:
    name: Proprietary
  title: quality-gate API
  version: v1
servers:
- description: 同一オリジン
  url: /
tags:
- description: 全リポジトリのサマリ
  name: Dashboard
- description: Run の参照
  name: Runs
- description: 再評価（管理者のみ）
  name: Operations
- description: ログイン中の利用者
  name: Me
- description: CI からの計測結果の取り込み
  name: Ingest
- description: リリース判定（UC-06）
  name: Release
- description: 監査ログの閲覧（管理者のみ）
  name: AuditLogs
- description: 設定の表示・検証結果
  name: Config
- description: リポジトリ単位の参照
  name: Repositories
- description: リポジトリの登録と設定（管理者のみ）
  name: RepositoryAdmin
- description: 許可リストとロールの管理（管理者のみ）
  name: Users
paths:
  /api/v1/audit-logs:
    get:
      operationId: list_4
      parameters:
      - description: 省略時は to の 30 日前
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: 省略時は現在時刻
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: 操作種別（REPOSITORY_UPDATED など）
        in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
          description: OK
      summary: 監査ログを新しい順に一覧する
      tags:
      - AuditLogs
  /api/v1/dashboard:
    get:
      description: 不合格・注意を先頭に並べる。開く目的が「問題があるか確認すること」であるため。
      operationId: dashboard
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DashboardResponse"
          description: OK
      summary: ダッシュボードを取得する
      tags:
      - Dashboard
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: ログイン中の利用者とロールを返す
      tags:
      - Me
  /api/v1/repositories:
    get:
      operationId: list_3
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryList"
          description: OK
      summary: 登録済みのリポジトリを一覧する
      tags:
      - Repositories
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryAdminResponse"
          description: OK
      summary: リポジトリを登録する
      tags:
      - RepositoryAdmin
  /api/v1/repositories/{repositoryId}:
    get:
      description: "指標の表は latestRun の Run 詳細（GET /api/v1/runs/{runId}）から描く。判定表の組み立\
        てを 2 箇所に持たないため。"
      operationId: detail
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryDetail"
          description: OK
      summary: リポジトリ詳細を取得する
      tags:
      - Repositories
    patch:
      operationId: update_1
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryAdminResponse"
          description: OK
      summary: リポジトリの設定を更新する（既定ブランチ・有効/無効）
      tags:
      - RepositoryAdmin
  /api/v1/repositories/{repositoryId}/config:
    get:
      description: 検証エラーは行番号とキーのパス付きで返す。書いた人が自力で直せるように。
      operationId: get
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepositoryConfig"
          description: OK
      summary: 現在の設定と直近の検証結果を取得する
      tags:
      - Config
  /api/v1/repositories/{repositoryId}/release-report:
    get:
      description: 指定したタグ・コミットで判定済みの Run から、リリースしてよいかと全指標の合否を返す。タグは、そのタグを付けて計測した Run
        からコミットを探す。ブランチ名は受け付けない
      operationId: releaseReport
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - description: タグ名、またはコミット SHA（7〜40 桁）
        in: query
        name: ref
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReleaseReportResponse"
          description: OK
      summary: リリース判定を取得する
      tags:
      - Release
  /api/v1/repositories/{repositoryId}/release-report.csv:
    get:
      description: 1 行が 1 指標。判定の前提（コミット・Run・合格ラインの版）と出力日時・出力者を各行に含む。UTF-8（BOM つき）。出力したことを監査ログに残す
      operationId: releaseReportCsv
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: ref
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: リリース判定を CSV で取得する
      tags:
      - Release
  /api/v1/repositories/{repositoryId}/trends:
    get:
      description: 計測環境ごとに系列を分ける。未計測は値 null の点として返し、0 にしない。
      operationId: trends
      parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - description: 指標 ID（M-01 など）
        in: query
        name: metricId
        required: true
        schema:
          type: string
      - description: 省略時はリポジトリの既定ブランチ
        in: query
        name: branch
        required: false
        schema:
          type: string
      - description: 省略時は to の 30 日前
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: 省略時は現在時刻
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrendResponse"
          description: OK
      summary: 指標の時系列を取得する
      tags:
      - Repositories
  /api/v1/runs:
    get:
      operationId: list_1
      parameters:
      - in: query
        name: repositoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunListResponse"
          description: OK
      summary: Run を新しい順に一覧する
      tags:
      - Runs
    post:
      description: 計測開始時に呼ぶ。同一コミットへの再送信は attempt を増やした新しい Run になる。
      operationId: createRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
          description: OK
      summary: Run を作成する
      tags:
      - Ingest
  /api/v1/runs/{runId}:
    get:
      description: 指標はカテゴリごとにまとめて返す。分類規則を画面に持たせない。
      operationId: detail_1
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunDetailResponse"
          description: OK
      summary: Run の判定結果を取得する
      tags:
      - Runs
  /api/v1/runs/{runId}/artifacts:
    get:
      operationId: list_2
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
          description: OK
      summary: Run に取り込んだ成果物を一覧する
      tags:
      - Runs
    post:
      description: この時点ではパースしない。受領・検証・保存のみを行い、パースは確定時の判定で行う。
      operationId: uploadArtifact
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: component
        required: false
        schema:
          type: string
      - in: query
        name: scope
        required: false
        schema:
          type: string
      - in: query
        name: metadata
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadArtifactResponse"
          description: OK
      summary: 成果物をアップロードする
      tags:
      - Ingest
  /api/v1/runs/{runId}/artifacts/{artifactId}/content:
    get:
      description: 保持期間を過ぎて実体を削除済みなら 409 ARTIFACTS_DELETED。
      operationId: content
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: artifactId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
      summary: 成果物をダウンロードする
      tags:
      - Runs
  /api/v1/runs/{runId}/finalize:
    post:
      description: その場で判定し、判定結果を返す。判定に失敗した場合も 200 で、status が FAILED になる（理由は Run 詳細に表示される）。
      operationId: finalizeRun
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalizeResponse"
          description: OK
      summary: 取り込み完了を宣言し、判定する
      tags:
      - Ingest
  /api/v1/runs/{runId}/findings:
    get:
      description: state を省略すると新規・継続・初回のみを返す。解消済みは明示指定が必要。
      operationId: findings
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - description: 指標 ID。複数指定可
        in: query
        name: metricId
        required: false
        schema:
          type: array
          items:
            type: string
      - description: 省略時は NEW / CONTINUING / INITIAL
        in: query
        name: state
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: severity
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FindingListResponse"
          description: OK
      summary: Run に紐づく違反を一覧する
      tags:
      - Runs
  /api/v1/runs/{runId}/reevaluate:
    post:
      description: 保存済みの成果物と、その Run とともに送られた設定を読み直して、その場で判定し直す。成果物が保持期間を過ぎて削除されていれば
        409 ARTIFACTS_DELETED。判定に失敗した場合も 200 で、status が FAILED になる。
      operationId: reevaluate
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReevaluateResponse"
          description: OK
      summary: Run を再評価する
      tags:
      - Operations
  /api/v1/users:
    get:
      operationId: list
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserList"
          description: OK
      summary: 許可リストの利用者を一覧する
      tags:
      - Users
    post:
      description: GitHub ログイン名の実在は確認しない。存在しない名前はログインできないだけで害がない。
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      summary: 許可リストに利用者を追加する
      tags:
      - Users
  /api/v1/users/{userId}:
    patch:
      description: 自分自身の降格・無効化と、有効な管理者が 0 人になる変更は 409 ADMIN_REQUIRED。
      operationId: update
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      summary: ロールの変更・無効化
      tags:
      - Users
components:
  schemas:
    ArtifactItem:
      type: object
      properties:
        artifactId:
          type: string
          format: uuid
        component:
          type:
          - string
          - "null"
        deleted:
          type: boolean
          description: 保持期間を過ぎて実体を削除済みなら true。ダウンロードできない
        filename:
          type: string
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
        type:
          type: string
        uploadedAt:
          type: string
          format: date-time
      required:
      - artifactId
      - component
      - deleted
      - filename
      - sha256
      - sizeBytes
      - type
      - uploadedAt
    ArtifactListResponse:
      type: object
      description: Run に取り込んだ成果物の一覧（FR-07-5）
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactItem"
      required:
      - items
    AuditLogItem:
      type: object
      properties:
        action:
          type: string
        actorLogin:
          type:
          - string
          - "null"
          description: 日次バッチの操作は system
        after:
          type:
          - object
          - "null"
          additionalProperties: {}
          description: 変更後の値
        auditLogId:
          type: string
          format: uuid
        before:
          type:
          - object
          - "null"
          additionalProperties: {}
          description: 変更前の値
        occurredAt:
          type: string
          format: date-time
        targetId:
          type:
          - string
          - "null"
        targetType:
          type: string
      required:
      - action
      - actorLogin
      - after
      - auditLogId
      - before
      - occurredAt
      - targetId
      - targetType
    AuditLogListResponse:
      type: object
      description: 監査ログ。新しいものから返す
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogItem"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - hasMore
      - items
      - nextCursor
    ConfigValidation:
      type: object
      description: 設定ファイルの検証結果。不正なら判定されず、Run は処理失敗になる
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"
        rawYaml:
          type:
          - string
          - "null"
          description: 検証に失敗した設定ファイルの内容
        runId:
          type:
          - string
          - "null"
          format: uuid
          description: 検証に失敗した Run
        valid:
          type: boolean
      required:
      - errors
      - rawYaml
      - runId
      - valid
    ConfigVersion:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        gateConfigId:
          type: string
          format: uuid
        parsed:
          type: object
          additionalProperties: {}
        rawYaml:
          type: string
        sourceCommitSha:
          type:
          - string
          - "null"
        sourceType:
          type: string
        version:
          type: integer
          format: int32
      required:
      - createdAt
      - gateConfigId
      - parsed
      - rawYaml
      - sourceCommitSha
      - sourceType
      - version
    CreateRepositoryRequest:
      type: object
      properties:
        defaultBranch:
          type:
          - string
          - "null"
          description: 省略時は main
          maxLength: 255
          minLength: 0
        name:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9._-]{1,100}$"
        owner:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$"
      required:
      - name
      - owner
    CreateRunRequest:
      type: object
      description: Run の作成要求。CI が計測開始時に送信する。
      properties:
        baseCommitSha:
          type: string
          description: 差分計測の比較基準（収集ランナーが求めて送る）。省略すると比較元なしで判定する
          pattern: "^[0-9a-f]{40}$"
        branch:
          type: string
          minLength: 1
        ciRunUrl:
          type: string
        commitSha:
          type: string
          description: 計測対象のコミット SHA（40 桁）
          minLength: 1
          pattern: "^[0-9a-f]{40}$"
        measuredAt:
          type: string
          format: date-time
        pullRequestNumber:
          type: integer
          format: int32
        repository:
          type: string
          description: owner/name 形式。Ingest Token の発行元と一致する必要がある
          example: ymiyamoto63/quality-gate
          minLength: 1
          pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"
        skippedMetrics:
          type: array
          description: CI が実行しなかった指標の申告。省略時は全指標を計測したものとして扱う
          items:
            $ref: "#/components/schemas/SkippedMetricRequest"
        tags:
          type: array
          description: 計測したコミットを指すタグ（収集ランナーが対象リポジトリの履歴から求める）。リリース判定でタグをコミットに解決するのに使う
          items:
            type: string
            maxLength: 255
            minLength: 0
            pattern: "^(?!/)(?!.*\\.\\.)(?!.*/$)[^\\s\\p{Cntrl}~^:?*\\[\\\\]+$"
          maxItems: 100
          minItems: 0
        triggeredBy:
          type: string
          minLength: 1
      required:
      - branch
      - commitSha
      - measuredAt
      - repository
      - triggeredBy
    CreateRunResponse:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        detailUrl:
          type: string
          description: Run 詳細画面への直リンク。CI のログに出して、不合格時にその場から飛べるようにする
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - FINALIZED
          - PROCESSING
          - EVALUATED
          - FAILED
          - ABANDONED
    CreateUserRequest:
      type: object
      properties:
        githubLogin:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$"
        role:
          type:
          - string
          - "null"
          description: 省略時は VIEWER
          enum:
          - ADMIN
          - VIEWER
      required:
      - githubLogin
    DashboardResponse:
      type: object
      description: ダッシュボード。リポジトリごとの最新の判定済み Run と、最後の完全計測。
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryCard"
    FinalizeResponse:
      type: object
      description: 確定と判定の結果。収集ランナーはこれをログに出す
      properties:
