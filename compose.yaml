# 開発時は `docker compose up db` で PostgreSQL のみを起動する。
# アプリもコンテナで動かす場合は `docker compose --profile full up` とする。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qualitygate
      POSTGRES_USER: qualitygate
      POSTGRES_PASSWORD: qualitygate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualitygate -d qualitygate"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    # 計測対象（QG_REPOSITORY）・ログイン・Ingest Token・合格ライン（QG_*）は .env から渡す
    env_file:
      - path: .env
        required: false
    environment:
      QG_DB_URL: jdbc:postgresql://db:5432/qualitygate
      QG_DB_USERNAME: qualitygate
      QG_DB_PASSWORD: qualitygate
      QG_ARTIFACT_ROOT: /var/lib/quality-gate/artifacts
      # コンテナで動かすときは JSON 構造化ログにする（ログ基盤で requestId / runId を検索できるように）
      QG_LOG_FORMAT: ${QG_LOG_FORMAT:-ecs}
    ports:
      - "8080:8080"
    volumes:
      # 名前付きボリュームにする。バインドマウント（./data/artifacts）だと Docker がホスト側に root 所有で
      # ディレクトリを作り、uid 10001 で動くアプリが成果物を書き込めない（名前付きボリュームはイメージ側の所有者を引き継ぐ）
      - artifacts:/var/lib/quality-gate/artifacts
    healthcheck:
      # 実行イメージ（eclipse-temurin:25-jre）には wget / curl が無いため、bash の /dev/tcp で問い合わせる
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  artifacts:
