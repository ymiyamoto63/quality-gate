# like-chatgpt の合格ライン（収集ランナー用）
#
# 収集ランナー（collector/bin/submit.sh）が Run ごとにこのファイルを送り、quality-gate はこの内容で判定する（D-20）。
# 変更は main にマージした後の計測から効く。画面（S-06）は表示するだけで、編集はできない。
#
# like-chatgpt の .quality-gate.yml との違い:
#   - mutation_score は対象と同じ（全量・60%）。収集ランナーは PR では PIT を実行せずスキップを申告するため、
#     skippable_metrics に mutation_score が必要
#   - performance は収集ランナーの負荷試験（collector/targets/ymiyamoto63__like-chatgpt.k6.js）で計測する。
#     M-02 と同じく PR では実行せずスキップを申告するため、skippable_metrics に performance が必要
version: 1
on_missing_report: fail

execution:
  skippable_metrics: [mutation_score, performance]   # PR の計測では M-02 と M-03〜05 をスキップする

components:
  - name: backend
    language: java
    paths: ["backend/**"]
  - name: frontend
    language: typescript
    paths: ["frontend/**"]

exclusions:
  - "**/ChatBackendApplication.java"
  - "**/main.ts"
  - "**/*.d.ts"
  - "**/*.config.ts"

metrics:
  branch_coverage:
    enabled: true
    threshold: 75
    scope: overall
    per_component: true
    diff_threshold: 80
  mutation_score:
    enabled: true
    threshold: 60
    scope: all                    # 収集ランナーは PR 以外の計測で全量を実行する
    components: [backend]
  performance:
    enabled: true
    p95_ms: 500
    arrival_rate_rps: 50          # k6 のシナリオの到達率の合計と一致させる
    error_rate_pct: 0.1
    scenarios: [chat, suggest, monitoring]   # k6 のシナリオ名と一致させる
  vulnerabilities:
    enabled: true
    max_critical: 0
    max_high: 0
    max_medium: null
  cyclomatic_complexity:
    enabled: true
    max_complexity: 15
    scope: new_and_modified
    warn_from: 11
  api_contract:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    breaking_changes: 0
  # すべてのテスト（backend の Surefire / Failsafe と frontend の Vitest）の成功率とスキップの増加
  test_results:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    max_skipped_increase: 0
  # コミットされた鍵やトークン（Trivy のシークレットの走査）。1 件でも不合格
  secrets:
    enabled: true
    max_secrets: 0
  # 依存関係のライセンス（Trivy の分類）。forbidden は不合格、restricted・分類不明は警告
  licenses:
    enabled: true
    max_forbidden: 0
  # 参考値の指標（M-15 コード重複率 / M-16 Lighthouse / M-17 バンドルサイズ）。
  # 合格ラインを持たず、値とトレンドだけを残す（合否・部分計測には影響しない）。書けるのは enabled だけ
  duplication:
    enabled: true
  lighthouse:
    enabled: true
  bundle_size:
    enabled: true
  accessibility:
    enabled: true
    standard: wcag22aa
    max_critical: 0
    # 計測プロファイルの A11Y_PAGES と一致させる。ここに書いた画面が検査結果に無ければ M-10 は ERROR
    pages:
      - "/"
