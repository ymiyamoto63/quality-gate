# like-chatgpt の合格ライン（収集ランナー用）
#
# 収集ランナー（collector/bin/submit.sh）が Run ごとにこのファイルを送り、quality-gate はこの内容で判定する（DD-13）。
# 変更は main にマージした後の計測から効く。画面（S-06）は表示するだけで、編集はできない。
#
# like-chatgpt の .quality-gate.yml との違い:
#   - mutation_score は対象と同じ（全量・60%）。収集ランナーは PR では PIT を実行せずスキップを申告するため、
#     skippable_metrics に mutation_score が必要
#   - performance は収集ランナーの負荷試験（collector/targets/ymiyamoto63__like-chatgpt.k6.js）で計測する。
#     M-02 と同じく PR では実行せずスキップを申告するため、skippable_metrics に performance が必要
version: 1

execution:
  skippable_metrics: [mutation_score, performance]   # PR の計測では M-02 と M-03〜05 をスキップする

exclusions:
  - "**/ChatBackendApplication.java"
  - "**/main.ts"
  - "**/*.d.ts"
  - "**/*.config.ts"

metrics:
  branch_coverage:
    enabled: true
    threshold: 75
    warn_below: 80                # 75% 以上 80% 未満は注意（WARN）
  mutation_score:
    enabled: true
    threshold: 60
    components: [backend]
  performance:
    enabled: true
    p95_ms: 500
    arrival_rate_rps: 50          # k6 のシナリオの到達率の合計と一致させる
    error_rate_pct: 0.1
    scenarios: [chat, suggest, monitoring]   # k6 のシナリオ名と一致させる
  vulnerabilities:
    enabled: true
    max_critical: 0
    max_high: 0
  cyclomatic_complexity:
    enabled: true
    max_complexity: 15
    warn_from: 11
  # 破壊的変更（oasdiff で比較元と OpenAPI 定義を比べる）
  api_contract:
    enabled: true
    breaking_changes: 0
  # すべてのテスト（backend の Surefire / Failsafe と frontend の Vitest）の成功率とスキップの増加
  test_results:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    max_skipped_increase: 0
  # コミットされた鍵やトークン（Trivy のシークレットの走査）。1 件でも不合格
  secrets:
    enabled: true
    max_secrets: 0
  # 依存関係のライセンス（Trivy の分類）。forbidden は不合格、restricted・分類不明は警告
  licenses:
    enabled: true
    max_forbidden: 0
  accessibility:
    enabled: true
    standard: wcag22aa
    max_critical: 0
    # 計測プロファイルの A11Y_PAGES と一致させる。ここに書いた画面が検査結果に無ければ M-09 は ERROR
    pages:
      - "/"
