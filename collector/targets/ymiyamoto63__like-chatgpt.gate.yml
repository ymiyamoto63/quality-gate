# like-chatgpt の合格ライン（収集ランナー用）
#
# 収集ランナーは .quality-gate.yml を送らないため、quality-gate は画面（S-06）で保存した設定で判定する。
# この内容を S-06 に貼り付けて保存する（このファイル自体は判定に使われない。控えと差分確認用）。
#
# like-chatgpt の .quality-gate.yml との違い:
#   - mutation_score は対象と同じ（全量・60%）。収集ランナーは PR では PIT を実行せずスキップを申告するため、
#     skippable_metrics に mutation_score が必要
version: 1
enforcement: report-only
on_missing_report: fail

execution:
  skippable_metrics: [mutation_score]   # PR の計測では M-02 をスキップする
  full_measurement_interval_days: 7
  reference_only_environments: [github-hosted]

components:
  - name: backend
    language: java
    paths: ["backend/**"]
  - name: frontend
    language: typescript
    paths: ["frontend/**"]

exclusions:
  - "**/ChatBackendApplication.java"
  - "**/main.ts"
  - "**/*.d.ts"
  - "**/*.config.ts"

metrics:
  branch_coverage:
    enabled: true
    threshold: 75
    scope: overall
    per_component: true
    diff_threshold: 80
  mutation_score:
    enabled: true
    threshold: 60
    scope: all                    # 収集ランナーは既定ブランチで全量を実行する
    components: [backend]
  performance:
    enabled: false
  vulnerabilities:
    enabled: true
    max_critical: 0
    max_high: 0
    max_medium: null
  cyclomatic_complexity:
    enabled: true
    max_complexity: 15
    scope: new_and_modified
    warn_from: 11
  api_contract:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    breaking_changes: 0
  # すべてのテスト（backend の Surefire / Failsafe と frontend の Vitest）の成功率とスキップの増加
  test_results:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    max_skipped_increase: 0
  accessibility:
    enabled: true
    standard: wcag22aa
    max_critical: 0
    # 計測プロファイルの A11Y_PAGES と一致させる。ここに書いた画面が検査結果に無ければ M-10 は ERROR
    pages:
      - "/"

notifications:
  on: transition_to_fail
