# like-chatgpt の合格ライン（収集ランナー用）
#
# 収集ランナー（collector/bin/submit.sh）が Run ごとにこのファイルを送り、quality-gate はこの内容で判定する（DD-13）。
# 変更は main にマージした後の計測から効く。画面（S-06）は表示するだけで、編集はできない。
#
# 指標の enabled は計測のオン・オフも兼ねる（docs/operations.md 4.3）。enabled: false にした指標は、
# 収集ランナーが計測自体を行わない。計測プロファイル（ymiyamoto63__like-chatgpt.env）の設定は残しておいてよい。
# 引用符の無い false / no / off が無効。"false" のように引用符で囲むと文字列になり、有効のままになる。
#
# like-chatgpt の .quality-gate.yml との違い:
#   - mutation_score は対象と同じ（全量・60%）。収集ランナーは PR では PIT を実行せずスキップを申告するため、
#     skippable_metrics に mutation_score が必要
#   - performance は収集ランナーの負荷試験（collector/targets/ymiyamoto63__like-chatgpt.k6.js）で計測する。
#     M-02 と同じく PR では実行せずスキップを申告するため、skippable_metrics に performance が必要。
#     今は enabled: false で負荷試験ごと止めている
version: 1

execution:
  skippable_metrics: [mutation_score, performance]   # PR の計測でスキップを申告する M-02 と M-03 / M-04

exclusions:
  - "**/ChatBackendApplication.java"
  - "**/main.ts"
  - "**/*.d.ts"
  - "**/*.config.ts"

metrics:
  # M-01 分岐網羅率（backend の JaCoCo と frontend の Vitest）
  branch_coverage:
    enabled: true
    threshold: 75                 # 75% 以上 80% 未満は注意（WARN）
  # M-02 ミューテーションスコア（PIT）。PR 以外の計測で全量を実行する
  mutation_score:
    enabled: true
    threshold: 60
    components: [backend]
  # M-03 / M-04 性能（k6 の負荷試験。1 回約 6 分 × 3 回）
  performance:
    enabled: false                # 負荷試験（約 18 分）を止めている。true に戻せば PR 以外の計測で実行する
    p95_ms: 500
    arrival_rate_rps: 50          # k6 のシナリオの到達率の合計と一致させる
    error_rate_pct: 0.1
    scenarios: [chat, suggest, monitoring]   # k6 のシナリオ名と一致させる
  # M-05 脆弱性（Trivy）
  vulnerabilities:
    enabled: true
    max_critical: 0
    max_high: 0
  # M-06 循環的複雑度（backend の PMD と frontend の ESLint）
  cyclomatic_complexity:
    enabled: true
    max_complexity: 15            # 11〜15 は注意（WARN）
  # M-07 破壊的変更（oasdiff で比較元と OpenAPI 定義を比べる）
  api_contract:
    enabled: true
    breaking_changes: 0
  # M-09 / M-10 すべてのテスト（backend の Surefire / Failsafe と frontend の Vitest）の成功率とスキップの増加
  test_results:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    max_skipped_increase: 0
  # M-11 コミットされた鍵やトークン（Trivy のシークレットの走査）。1 件でも不合格
  secrets:
    enabled: true
    max_secrets: 0
  # M-12 依存関係のライセンス（Trivy の分類）。forbidden は不合格、restricted・分類不明は警告
  licenses:
    enabled: true
    max_forbidden: 0
  # M-08 アクセシビリティ（axe-core で A11Y_PAGES の画面をライト・ダークで WCAG 2.2 AA を検査）
  accessibility:
    enabled: true
    max_critical: 0
    # 計測プロファイルの A11Y_PAGES と一致させる。ここに書いた画面が検査結果に無ければ M-08 は ERROR
    pages:
      - "/"
