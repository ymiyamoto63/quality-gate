# quality-gate 自身の品質ゲート設定（ドッグフーディング）
# 仕様: docs/02-metrics-spec.md
version: 1
enforcement: report-only          # report-only | check-run | blocking
on_missing_report: fail           # fail | warn

execution:
  # CI がスキップを申告できる指標。ここに無い指標のスキップ申告は ERROR とする
  skippable_metrics: [mutation_score, performance]
  # 完全計測がこの日数を超えて行われない場合に警告する
  full_measurement_interval_days: 7
  # この環境で計測された性能値は参考値（REFERENCE）とし、判定に用いない
  reference_only_environments: [github-hosted]

components:
  - name: backend
    language: java
    paths: ["backend/**"]
  - name: frontend
    language: typescript
    paths: ["frontend/**"]

# 除外パターンは「各ツールが報告するパスの形」に合わせて書く。
# JaCoCo はパッケージ相対（com/qualitygate/...）、lcov はコンポーネント相対
# （src/api/...）のパスを出すため、リポジトリ相対（backend/...）では一致しない。
# 迷う場合は **/ を先頭に付けた接尾一致で書く。
exclusions:
  - "**/generated/**"
  - "**/api/schema.d.ts"
  - "**/*.config.ts"
  - "**/QualityGateApplication.java"

metrics:
  branch_coverage:
    enabled: true
    threshold: 75
    scope: overall
    per_component: true
    diff_threshold: 80            # 変更行のカバレッジ（WARN 判定）
  mutation_score:
    enabled: true
    threshold: 60
    scope: changed
    components: [backend]         # PIT は JVM 専用のため backend のみ
  performance:
    enabled: true
    p95_ms: 500
    arrival_rate_rps: 50
    error_rate_pct: 0.1
    scenarios: ["dashboard", "run-detail", "ingest"]
  vulnerabilities:
    enabled: true
    max_critical: 0
    max_high: 0
    max_medium: null
  cyclomatic_complexity:
    enabled: true
    max_complexity: 15
    scope: new_and_modified
    warn_from: 11
  # 契約テストは API の応答を検証する結合テスト（*ApiIT）の JUnit XML、
  # 破壊的変更は merge-base の api/openapi.yml との oasdiff で計測する（CI の base ジョブ）
  api_contract:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    breaking_changes: 0
  accessibility:
    enabled: true
    standard: wcag22aa
    max_critical: 0
    # e2e/a11y.spec.ts と e2e/authenticated-a11y.spec.ts で検査している画面。
    # ここに書いた画面が検査結果に無ければ M-10 は ERROR になる。
    # ダッシュボード（/）は応答例の書き出しが未整備のため、まだ検査していない。
    # 設定・免除管理・利用者管理は画面が未実装（docs/08 の 8 章に検査対象として残る）
    pages:
      - "/login"
      - "/forbidden"
      - "/runs/:id"
      - "/runs/:id/findings"
      - "/repositories/:id/trends"

# 通知はメールで送る。条件と宛先は quality-gate の画面（管理 › 通知設定）で設定する
notifications:
  on: transition_to_fail
