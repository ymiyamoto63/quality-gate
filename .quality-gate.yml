# 対象の CI から直接送る方式の設定例（docs/operations/target-repository.md）
# quality-gate 自身はこの設定で計測・送信しない（D-18）。合格ラインの書き方の見本として残している
# 仕様: docs/initial/02-metrics-spec.md
version: 1
enforcement: report-only          # report-only | check-run | blocking
on_missing_report: fail           # fail | warn

execution:
  # CI がスキップを申告できる指標。ここに無い指標のスキップ申告は ERROR とする
  skippable_metrics: [mutation_score]
  # 完全計測がこの日数を超えて行われない場合に警告する
  full_measurement_interval_days: 7
  # この環境で計測された性能値は参考値（REFERENCE）とし、判定に用いない
  reference_only_environments: [github-hosted]

components:
  - name: backend
    language: java
    paths: ["backend/**"]
  - name: frontend
    language: typescript
    paths: ["frontend/**"]

# 除外パターンは「各ツールが報告するパスの形」に合わせて書く。
# JaCoCo はパッケージ相対（com/qualitygate/...）、lcov はコンポーネント相対
# （src/api/...）のパスを出すため、リポジトリ相対（backend/...）では一致しない。
# 迷う場合は **/ を先頭に付けた接尾一致で書く。
exclusions:
  - "**/generated/**"
  - "**/api/schema.d.ts"
  - "**/*.config.ts"
  - "**/QualityGateApplication.java"

metrics:
  branch_coverage:
    enabled: true
    threshold: 75
    scope: overall
    per_component: true
    diff_threshold: 80            # 変更行のカバレッジ（WARN 判定）
  mutation_score:
    enabled: true
    threshold: 60
    scope: changed
    components: [backend]         # PIT は JVM 専用のため backend のみ
  # 性能は計測しない（D-17。社内の少人数向けツールで、負荷試験が性能の保証にならないため）
  performance:
    enabled: false
  vulnerabilities:
    enabled: true
    max_critical: 0
    max_high: 0
    max_medium: null
  cyclomatic_complexity:
    enabled: true
    max_complexity: 15
    scope: new_and_modified
    warn_from: 11
  # 契約テストは API の応答を検証する結合テスト（*ApiIT）の JUnit XML、
  # 破壊的変更は merge-base の api/openapi.yml との oasdiff で計測する
  api_contract:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    breaking_changes: 0
  # すべてのテスト（backend の単体・結合テストと frontend の Vitest）の成功率とスキップの増加
  test_results:
    enabled: true
    min_success_rate: 100
    min_test_count: 1
    max_skipped_increase: 0
  # シークレット（M-13）とライセンス（M-14）。SARIF のメタデータで走査した対象（scanners）を申告したときだけ値が付く
  secrets:
    enabled: true
    max_secrets: 0
  licenses:
    enabled: true
    max_forbidden: 0
    # max_restricted: 0            # restricted（GPL など）も不合格にする場合
  # 参考値の指標（M-15 コード重複率 / M-16 Lighthouse / M-17 バンドルサイズ）。
  # 合格ラインを持たず、値とトレンドだけを残す（合否・部分計測には影響しない）。書けるのは enabled だけ
  duplication:
    enabled: true
  lighthouse:
    enabled: true
  bundle_size:
    enabled: true
  accessibility:
    enabled: true
    standard: wcag22aa
    max_critical: 0
    # e2e/a11y.spec.ts と e2e/authenticated-a11y.spec.ts で検査している画面。
    # ここに書いた画面が検査結果に無ければ M-10 は ERROR になる。
    # ダッシュボード（/）は応答例の書き出しが未整備のため、まだ検査していない
    pages:
      - "/login"
      - "/forbidden"
      - "/runs/:id"
      - "/runs/:id/findings"
      - "/repositories/:id"
      - "/repositories/:id/trends"
      - "/repositories/:id/config"
      - "/waivers"
      - "/reports"
      - "/admin/users"
      - "/admin/repositories"

# 通知はメールで送る。条件と宛先は quality-gate の画面（管理 › 通知設定）で設定する
notifications:
  on: transition_to_fail
