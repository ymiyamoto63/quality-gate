# 結合テストの接続先は Testcontainers が動的に差し込む。
spring:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false

quality-gate:
  artifact-root: ${java.io.tmpdir}/quality-gate-test-artifacts
  base-url: http://localhost:8080
  ingest-tokens: test-ingest-token-0123456789abcdef   # IntegrationCleanup.INGEST_TOKEN と一致させる
  schedule:                  # 日次バッチはテストから明示的に呼ぶ
    cleanup-retention: "-"
    abandon-stale-runs: "-"

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
