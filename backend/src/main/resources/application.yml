spring:
  application:
    name: quality-gate

  config:
    # ローカル開発用に .env を読む。backend/ からもリポジトリ直下からも起動できるよう両方を探す。
    # optional なので .env が無い環境（CI / コンテナ）では何もしない。
    # 実際の環境変数のほうが優先される。
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  threads:
    virtual:
      enabled: true          # 取り込みは I/O 中心。リアクティブを入れずに並行性を得る

  datasource:
    url: ${QG_DB_URL:jdbc:postgresql://localhost:5432/qualitygate}
    username: ${QG_DB_USERNAME:qualitygate}
    password: ${QG_DB_PASSWORD:qualitygate}

  jpa:
    hibernate:
      ddl-auto: none         # スキーマは Flyway のみが変更する
    open-in-view: false      # 遅延ロードをビュー層まで持ち込まない
    properties:
      hibernate:
        jdbc:
          batch_size: 100    # 判定結果は一括 INSERT する
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    jdbc:
      initialize-schema: never   # スキーマは Flyway（V001__init.sql）で管理する
    timeout: 8h

  servlet:
    multipart:
      # 通信としての上限。成果物の大きさの判定は quality-gate.max-artifact-bytes（既定 50MB）で行い、
      # 理由のわかるエラーを返す。ここはそれより少し大きくしておく
      max-file-size: 60MB
      max-request-size: 60MB

  security:
    oauth2:
      client:
        registration:
          github:
            # GitHub App の user-to-server 認可フローを使う（OAuth App は別途用意しない）
            client-id: ${QG_GITHUB_CLIENT_ID:placeholder-client-id}
            client-secret: ${QG_GITHUB_CLIENT_SECRET:placeholder-client-secret}
            scope: read:user

server:
  port: 8080
  error:
    include-message: never   # 例外メッセージの無検閲な露出を防ぐ（応答は ProblemDetail で組む）
  compression:
    enabled: true

# 既定値は QualityGateProperties が持つ。環境変数が未設定（空・0）なら既定値になる
quality-gate:
  artifact-root: ${QG_ARTIFACT_ROOT:}
  base-url: ${QG_BASE_URL:}
  # 収集ランナーが取り込み API に送る Ingest Token。交換のときは新旧をカンマ区切りで並べる（DD-20）
  ingest-tokens: ${QG_INGEST_TOKEN:}
  # データ保持期間（日。RET-1）。短くすると、翌日の保持期間バッチで古いデータが削除される
  retention:
    run-days: ${QG_RETENTION_RUN_DAYS:0}
    artifact-days: ${QG_RETENTION_ARTIFACT_DAYS:0}
    audit-log-days: ${QG_RETENTION_AUDIT_LOG_DAYS:0}
  # 日次バッチの時刻（cron）。"-" で無効になる
  schedule:
    zone: ${QG_SCHEDULE_ZONE:Asia/Tokyo}
    cleanup-retention: "0 0 3 * * *"
    abandon-stale-runs: "0 10 3 * * *"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  writer-with-order-by-keys: true   # 生成される openapi.yml の差分を安定させる

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.qualitygate: INFO
  # JSON 構造化ログ（docs/architecture.md 4.3）。QG_LOG_FORMAT に ecs / logstash / gelf を指定すると
  # 標準出力が 1 行 1 JSON になり、MDC の相関 ID（requestId / runId）が項目として載る。未指定なら従来のテキスト形式
  structured:
    format:
      console: ${QG_LOG_FORMAT:}
  pattern:
    # テキスト形式でも相関 ID を出す（値があるときだけ）
    correlation: "%replace(req=%X{requestId} ){'^req= $', ''}%replace(run=%X{runId} ){'^run= $', ''}"
