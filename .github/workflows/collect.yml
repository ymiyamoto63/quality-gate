# 収集ランナー: 計測対象のリポジトリを quality-gate 側で取得・計測し、Ingest API に送る。
# 対象リポジトリには何も置かない（docs/architecture/collector-runner.md、手順は docs/operations/collector.md）。
#
# 段階 1: 手動実行のみ。計測する指標は M-01 / M-06 / M-07 / M-08 / M-09。
#
# 必要な設定（Settings → Secrets and variables → Actions）:
#   Variables: QG_BASE_URL                   取り込み先の quality-gate の URL
#              QG_COLLECTOR_APP_ID           対象リポジトリを読む GitHub App の App ID
#   Secrets:   QG_COLLECTOR_APP_PRIVATE_KEY  同 App の秘密鍵
#              <計測プロファイルの INGEST_TOKEN_SECRET>  対象リポジトリの Ingest Token
#
# ジョブを 3 つに分け、対象のテストコードが動く measure ジョブには認証情報を渡さない。
name: collect

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 計測するリポジトリ（owner/name。collector/targets/ に計測プロファイルが必要）
        required: true
        default: ymiyamoto63/like-chatgpt
      branch:
        description: 計測するブランチ（空なら計測プロファイルの DEFAULT_BRANCH。PR の場合は PR のブランチ名）
        required: false
      commit:
        description: 計測するコミット（40 桁。空ならブランチまたは PR の先頭）
        required: false
      pull_request:
        description: PR を計測する場合の番号（比較元は既定ブランチとの merge-base）
        required: false

permissions:
  contents: read

concurrency:
  group: collect-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      java_version: ${{ steps.profile.outputs.java_version }}
      node_version: ${{ steps.node.outputs.node_version }}
      token_secret: ${{ steps.profile.outputs.token_secret }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 計測プロファイルの読み込み
        id: profile
        env:
          QG_TARGET: ${{ inputs.repository }}
        run: |
          source collector/bin/lib.sh
          load_profile "$QG_TARGET"
          {
            echo "owner=${QG_TARGET%%/*}"
            echo "name=${QG_TARGET#*/}"
            echo "java_version=${JAVA_VERSION:-}"
            echo "token_secret=${INGEST_TOKEN_SECRET}"
            echo "node_version_file=${NODE_VERSION_FILE:-}"
          } >> "$GITHUB_OUTPUT"

      # 対象リポジトリだけを読める、1 時間で失効するトークン。
      # App が未設定なら発行しない（public リポジトリはトークン無しで取得できる）
      - name: 読み取り用トークンの発行
        id: app-token
        if: vars.QG_COLLECTOR_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QG_COLLECTOR_APP_ID }}
          private-key: ${{ secrets.QG_COLLECTOR_APP_PRIVATE_KEY }}
          owner: ${{ steps.profile.outputs.owner }}
          repositories: ${{ steps.profile.outputs.name }}

      - name: 対象リポジトリの取得
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QG_TARGET: ${{ inputs.repository }}
          QG_BRANCH: ${{ inputs.branch }}
          QG_COMMIT: ${{ inputs.commit }}
          QG_PR_NUMBER: ${{ inputs.pull_request }}
        run: ./collector/bin/fetch.sh "$QG_TARGET" "$RUNNER_TEMP/qg-collector"

      - name: Node.js の版の解決
        id: node
        env:
          NODE_VERSION_FILE: ${{ steps.profile.outputs.node_version_file }}
        run: |
          VERSION=""
          if [ -n "$NODE_VERSION_FILE" ] && [ -f "$RUNNER_TEMP/qg-collector/src/$NODE_VERSION_FILE" ]; then
            VERSION=$(tr -d '[:space:]' < "$RUNNER_TEMP/qg-collector/src/$NODE_VERSION_FILE")
          fi
          echo "node_version=${VERSION:-22}" >> "$GITHUB_OUTPUT"

      - name: 受け渡し用にまとめる
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/qg-collector-source.tgz" qg-collector

      - uses: actions/upload-artifact@v4
        with:
          name: collector-source
          path: ${{ runner.temp }}/qg-collector-source.tgz
          retention-days: 1

  measure:
    needs: fetch
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: collector-source
          path: ${{ runner.temp }}
      - name: 展開
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/qg-collector-source.tgz"

      - uses: actions/setup-java@v4
        if: needs.fetch.outputs.java_version != ''
        with:
          distribution: temurin
          java-version: ${{ needs.fetch.outputs.java_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.fetch.outputs.node_version }}

      - name: 計測
        env:
          QG_TARGET: ${{ inputs.repository }}
        run: ./collector/bin/measure.sh "$QG_TARGET" "$RUNNER_TEMP/qg-collector" "$RUNNER_TEMP/qg-reports"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-reports
          path: ${{ runner.temp }}/qg-reports/
          retention-days: 7

      # セルフホストランナーに対象のソースを残さない
      - name: 作業領域の削除
        if: always()
        run: rm -rf "$RUNNER_TEMP/qg-collector" "$RUNNER_TEMP/qg-collector-source.tgz" "$RUNNER_TEMP/qg-reports"

  submit:
    needs: [fetch, measure]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: collector-reports
          path: ${{ runner.temp }}/qg-reports
      - name: quality-gate へ送信
        env:
          QG_BASE_URL: ${{ vars.QG_BASE_URL }}
          QG_INGEST_TOKEN: ${{ secrets[needs.fetch.outputs.token_secret] }}
          QG_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$QG_BASE_URL" ] || [ -z "$QG_INGEST_TOKEN" ]; then
            echo "::error::QG_BASE_URL（Variables）または ${{ needs.fetch.outputs.token_secret }}（Secrets）が未設定です"
            exit 1
          fi
          ./collector/bin/submit.sh "$RUNNER_TEMP/qg-reports"
