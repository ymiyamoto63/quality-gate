# 収集ランナー: 計測対象のリポジトリを quality-gate 側で取得・計測し、Ingest API に送る。
# 対象リポジトリには何も置かない（docs/architecture.md 3 章、手順は docs/operations.md）。
#
# 起動は手動実行だけ（DD-8）。ブランチ（またはコミット・タグ）を指定して計測する。
# 計測対象は quality-gate アプリの QG_REPOSITORY で決まる。fetch がアプリの設定を読み、QG_REPOSITORY が一致する
# 計測プロファイル（collector/targets/*/profile.env）を使う。対象を切り替えるときはアプリの QG_REPOSITORY だけを変える。
# リリース判定に使うときは、commit にリリースのタグを指定する（比較元は前のタグになる）。
#
# 計測する指標は M-01〜M-12。quality-gate の QG_DISABLED_METRICS（fetch で読む）に書いたものは除く。
#
# 必要な設定（Settings → Secrets and variables → Actions）:
#   Variables: QG_BASE_URL                   取り込み先の quality-gate の URL
#              QG_COLLECTOR_APP_ID           対象リポジトリを読む GitHub App の App ID
#   Secrets:   QG_COLLECTOR_APP_PRIVATE_KEY  同 App の秘密鍵
#              QG_INGEST_TOKEN               quality-gate の Ingest Token（バックエンドの QG_INGEST_TOKEN と同じ値）
#
# ジョブを 3 つ（fetch → measure → submit）に分け、対象のテストコードが動く measure ジョブには認証情報を渡さない。
# Ingest Token は fetch（quality-gate の設定を読む）と submit（送信）だけが使う。
# measure ジョブの計測はコンテナの中で動かす（collector/bin/measure-isolated.sh）。
name: collect
# 画面に出す名前（例: collect main / collect v1.2.0）。計測対象は fetch のログと submit の結果に出る
run-name: collect ${{ inputs.commit || inputs.branch || 'default' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 計測するブランチ（空なら計測プロファイルの DEFAULT_BRANCH）
        required: false
      commit:
        description: 計測するコミット（40 桁の SHA）またはタグ（空ならブランチの先頭）。リリース判定にはタグを指定する
        required: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 計測対象はアプリの QG_REPOSITORY で決まる。計測プロファイルがあるかもここで確かめる
      - name: 計測対象の決定
        id: profile
        env:
          QG_BASE_URL: ${{ vars.QG_BASE_URL }}
          QG_INGEST_TOKEN: ${{ secrets.QG_INGEST_TOKEN }}
        run: |
          if [ -z "$QG_BASE_URL" ] || [ -z "$QG_INGEST_TOKEN" ]; then
            echo "::error::QG_BASE_URL（Variables）または QG_INGEST_TOKEN（Secrets）が未設定です"
            exit 1
          fi
          source collector/bin/lib.sh
          read_app_settings
          TARGET=$(find_target "$APP_REPOSITORY") || exit 1
          echo "計測対象: $APP_REPOSITORY（collector/targets/$TARGET）"
          {
            echo "owner=${APP_REPOSITORY%%/*}"
            echo "name=${APP_REPOSITORY#*/}"
          } >> "$GITHUB_OUTPUT"

      # 対象リポジトリだけを読める、1 時間で失効するトークン。
      # App が未設定なら発行しない（public リポジトリはトークン無しで取得できる）
      - name: 読み取り用トークンの発行
        id: app-token
        if: vars.QG_COLLECTOR_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QG_COLLECTOR_APP_ID }}
          private-key: ${{ secrets.QG_COLLECTOR_APP_PRIVATE_KEY }}
          owner: ${{ steps.profile.outputs.owner }}
          repositories: ${{ steps.profile.outputs.name }}

      # quality-gate の設定（計測対象のリポジトリ・判定しない指標・M-08 の画面）も読み、計測プロファイルを meta.env に書く。計測に時間をかける前に設定の誤りで止める
      - name: 対象リポジトリの取得
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QG_BRANCH: ${{ inputs.branch }}
          QG_COMMIT: ${{ inputs.commit }}
          QG_BASE_URL: ${{ vars.QG_BASE_URL }}
          QG_INGEST_TOKEN: ${{ secrets.QG_INGEST_TOKEN }}
        run: ./collector/bin/fetch.sh "$RUNNER_TEMP/qg-collector"

      - name: 受け渡し用にまとめる
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/qg-collector-source.tgz" qg-collector

      - uses: actions/upload-artifact@v4
        with:
          name: collector-source
          path: ${{ runner.temp }}/qg-collector-source.tgz
          retention-days: 1

  measure:
    needs: fetch
    runs-on: self-hosted
    # ビルド・テストに加えて PIT と負荷試験（有効なら約 18 分）を実行する
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: collector-source
          path: ${{ runner.temp }}
      - name: 展開
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/qg-collector-source.tgz"

      - name: 計測
        run: ./collector/bin/measure-isolated.sh "$RUNNER_TEMP/qg-collector" "$RUNNER_TEMP/qg-reports"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-reports
          path: ${{ runner.temp }}/qg-reports/
          retention-days: 7

      # セルフホストランナーに対象のソースを残さない
      - name: 作業領域の削除
        if: always()
        run: rm -rf "$RUNNER_TEMP/qg-collector" "$RUNNER_TEMP/qg-collector-source.tgz" "$RUNNER_TEMP/qg-reports"

  submit:
    needs: [fetch, measure]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: collector-reports
          path: ${{ runner.temp }}/qg-reports
      - name: quality-gate へ送信
        env:
          QG_BASE_URL: ${{ vars.QG_BASE_URL }}
          QG_INGEST_TOKEN: ${{ secrets.QG_INGEST_TOKEN }}
          QG_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$QG_BASE_URL" ] || [ -z "$QG_INGEST_TOKEN" ]; then
            echo "::error::QG_BASE_URL（Variables）または QG_INGEST_TOKEN（Secrets）が未設定です"
            exit 1
          fi
          ./collector/bin/submit.sh "$RUNNER_TEMP/qg-reports"

