# 収集ランナー: 計測対象のリポジトリを quality-gate 側で取得・計測し、Ingest API に送る。
# 対象リポジトリには何も置かない（docs/architecture.md 3 章、手順は docs/operations.md）。
#
# 起動は手動実行だけ（DD-7）。対象とブランチ（またはコミット・タグ・PR）を指定して計測する。
# リリース判定（DD-16）に使うときは、commit にリリースのタグを指定する（比較元は前のタグになる）。
#
# 計測する指標は M-01〜M-12。M-02（PIT）と M-03 / M-04（k6 の負荷試験）は PR 以外の計測でだけ実行する。
#
# 必要な設定（Settings → Secrets and variables → Actions）:
#   Variables: QG_BASE_URL                   取り込み先の quality-gate の URL
#              QG_COLLECTOR_APP_ID           対象リポジトリを読む GitHub App の App ID
#   Secrets:   QG_COLLECTOR_APP_PRIVATE_KEY  同 App の秘密鍵
#              QG_INGEST_TOKEN               quality-gate の Ingest Token（バックエンドの QG_INGEST_TOKEN と同じ値）
#
# ジョブを 3 つ（fetch → measure → submit）に分け、対象のテストコードが動く measure ジョブには認証情報を渡さない。
# measure ジョブの計測はコンテナの中で動かす（collector/bin/measure-isolated.sh）。
name: collect
# 画面に出す名前（例: ymiyamoto63/like-chatgpt main / ymiyamoto63/like-chatgpt #14 / ymiyamoto63/like-chatgpt v1.2.0）
run-name: ${{ inputs.repository }} ${{ inputs.pull_request != '' && format('#{0}', inputs.pull_request) || inputs.commit || inputs.branch || 'default' }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 計測するリポジトリ（owner/name。collector/targets/ に計測プロファイルが必要）
        required: true
        default: ymiyamoto63/like-chatgpt
      branch:
        description: 計測するブランチ（空なら計測プロファイルの DEFAULT_BRANCH。PR の場合は PR のブランチ名）
        required: false
      commit:
        description: 計測するコミット（40 桁の SHA）またはタグ（空ならブランチまたは PR の先頭）
        required: false
      pull_request:
        description: PR を計測する場合の番号
        required: false
      base_branch:
        description: 比較元を決めるブランチ（空なら既定ブランチ。PR ではマージ先のブランチ）
        required: false
      base:
        description: 比較元のコミット（40 桁の SHA）またはタグ（空なら自動。タグの計測では前のタグ）
        required: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 計測プロファイルの読み込み
        id: profile
        env:
          QG_TARGET: ${{ inputs.repository }}
        run: |
          source collector/bin/lib.sh
          load_profile "$QG_TARGET"
          {
            echo "owner=${QG_TARGET%%/*}"
            echo "name=${QG_TARGET#*/}"
          } >> "$GITHUB_OUTPUT"

      # 対象リポジトリだけを読める、1 時間で失効するトークン。
      # App が未設定なら発行しない（public リポジトリはトークン無しで取得できる）
      - name: 読み取り用トークンの発行
        id: app-token
        if: vars.QG_COLLECTOR_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QG_COLLECTOR_APP_ID }}
          private-key: ${{ secrets.QG_COLLECTOR_APP_PRIVATE_KEY }}
          owner: ${{ steps.profile.outputs.owner }}
          repositories: ${{ steps.profile.outputs.name }}

      - name: 対象リポジトリの取得
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QG_TARGET: ${{ inputs.repository }}
          QG_BRANCH: ${{ inputs.branch }}
          QG_COMMIT: ${{ inputs.commit }}
          QG_PR_NUMBER: ${{ inputs.pull_request }}
          QG_BASE_BRANCH: ${{ inputs.base_branch }}
          QG_BASE: ${{ inputs.base }}
        run: ./collector/bin/fetch.sh "$QG_TARGET" "$RUNNER_TEMP/qg-collector"

      - name: 受け渡し用にまとめる
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/qg-collector-source.tgz" qg-collector

      - uses: actions/upload-artifact@v4
        with:
          name: collector-source
          path: ${{ runner.temp }}/qg-collector-source.tgz
          retention-days: 1

  measure:
    needs: fetch
    runs-on: self-hosted
    # PR 以外の計測は、ビルド・テストに加えて PIT と負荷試験（約 18 分）を実行する
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: collector-source
          path: ${{ runner.temp }}
      - name: 展開
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/qg-collector-source.tgz"

      - name: 計測
        env:
          QG_TARGET: ${{ inputs.repository }}
        run: ./collector/bin/measure-isolated.sh "$QG_TARGET" "$RUNNER_TEMP/qg-collector" "$RUNNER_TEMP/qg-reports"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-reports
          path: ${{ runner.temp }}/qg-reports/
          retention-days: 7

      # セルフホストランナーに対象のソースを残さない
      - name: 作業領域の削除
        if: always()
        run: rm -rf "$RUNNER_TEMP/qg-collector" "$RUNNER_TEMP/qg-collector-source.tgz" "$RUNNER_TEMP/qg-reports"

  submit:
    needs: [fetch, measure]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: collector-reports
          path: ${{ runner.temp }}/qg-reports
      - name: quality-gate へ送信
        env:
          QG_BASE_URL: ${{ vars.QG_BASE_URL }}
          QG_INGEST_TOKEN: ${{ secrets.QG_INGEST_TOKEN }}
          QG_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$QG_BASE_URL" ] || [ -z "$QG_INGEST_TOKEN" ]; then
            echo "::error::QG_BASE_URL（Variables）または QG_INGEST_TOKEN（Secrets）が未設定です"
            exit 1
          fi
          ./collector/bin/submit.sh "$RUNNER_TEMP/qg-reports"

