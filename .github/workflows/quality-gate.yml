# quality-gate 自身を計測するワークフロー（main への push と手動実行のみ）。
# Pull Request では計測せず、ユニットテストだけを ci.yml で実行する。
#
# 性能（M-03〜05）は計測しない（D-17。performance は .quality-gate.yml で無効にしている）。
#
# ランナー種別と重量ジョブ（PIT）の実行可否を切り替えられる。
#   - 常用の既定値: リポジトリ変数 QG_RUNNER / QG_RUN_HEAVY_ON_GITHUB
#   - その回限りの上書き: workflow_dispatch の入力
#
# GitHub Free のプライベートリポジトリでは Actions の無料枠が月 2,000 分のため、
# 実行時間の長い PIT は既定でセルフホストランナーに寄せる
# （セルフホストランナーの実行時間は無料枠を消費しない）。
name: quality-gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 実行するランナー
        type: choice
        options: [self-hosted, ubuntu-latest]
        default: self-hosted
      run_heavy_jobs:
        description: GitHub ホストランナーでも PIT を実行する
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      runner_type: ${{ steps.resolve.outputs.runner_type }}
      run_heavy: ${{ steps.resolve.outputs.run_heavy }}
    steps:
      - id: resolve
        run: |
          RUNNER="${{ inputs.runner || vars.QG_RUNNER || 'self-hosted' }}"
          HEAVY="${{ inputs.run_heavy_jobs || vars.QG_RUN_HEAVY_ON_GITHUB || 'false' }}"
          if [ "$RUNNER" = "self-hosted" ]; then
            RUNNER_TYPE="self-hosted"
            HEAVY="true"          # 専有ランナーでは常に全量を計測する
          else
            RUNNER_TYPE="github-hosted"
          fi
          {
            echo "runner=$RUNNER"
            echo "runner_type=$RUNNER_TYPE"
            echo "run_heavy=$HEAVY"
          } >> "$GITHUB_OUTPUT"

  # 軽量ジョブ: 常に実行する
  base:
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base の解決に履歴が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: バックエンドのビルドとテスト（JaCoCo / PMD / OpenAPI 生成）
        run: ./backend/mvnw -f backend/pom.xml -B verify

      - name: 生成物の同期検証
        run: |
          cd frontend && npm ci && npm run generate:api && cd ..
          git diff --exit-code api/ frontend/src/api/schema.d.ts \
            || { echo '::error::openapi.yml または schema.d.ts が最新ではありません。再生成してコミットしてください'; exit 1; }

      # M-01（Java）と M-07 の成果物。submit ジョブへは reports/ だけを受け渡す
      - name: JaCoCo と PMD の結果の収集（M-01 / M-07）
        if: always()
        run: |
          mkdir -p reports/backend
          cp backend/target/site/jacoco/jacoco.xml reports/backend/ || true
          cp backend/target/pmd.xml reports/backend/ || true

      # M-08 の契約テストは、API の応答を検証する結合テスト（*ApiIT）とする。
      # 単体テストまで送ると、M-08 が単体テスト全体の成功率になってしまう
      - name: 契約テストの結果の収集（M-08）
        if: always()
        run: |
          mkdir -p reports/contract
          cp backend/target/failsafe-reports/TEST-*ApiIT.xml reports/contract/

      # M-09: 比較元（push なら直前のコミット。base_ref があればベースブランチとの merge-base）の
      # api/openapi.yml と比べる。比較元に定義が無ければ新規 API として申告する
      - name: OpenAPI の破壊的変更の検出（oasdiff / M-09）
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          else
            BASE=$(git rev-parse HEAD~1)
          fi
          if git show "$BASE:api/openapi.yml" > reports/openapi-base.yml 2>/dev/null; then
            docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff \
              breaking reports/openapi-base.yml api/openapi.yml --format json > reports/oasdiff.json
            # oasdiff は正常終了した。変更が無いときの空出力は 0 件として送る
            [ -s reports/oasdiff.json ] || echo '[]' > reports/oasdiff.json
          else
            echo '[]' > reports/oasdiff.json
            touch reports/oasdiff-base-spec-missing
          fi

      - name: フロントエンドのテスト（Vitest / カバレッジ）
        run: cd frontend && npm run test:coverage

      - name: 脆弱性スキャン（Trivy）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: reports/trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: アクセシビリティ検査（Playwright + axe-core）
        run: cd frontend && npx playwright install --with-deps chromium && npm run test:a11y

      # テストが落ちても成果物は送る。違反で落ちたときこそ、その違反を判定に届ける必要がある
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-base
          path: reports/

  # 重量ジョブ: セルフホストなら常に、GitHub ホストなら設定次第で実行する
  mutation:
    needs: setup
    if: needs.setup.outputs.run_heavy == 'true'
    runs-on: ${{ needs.setup.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: ミューテーションテスト（PIT）
        run: ./backend/mvnw -f backend/pom.xml -B -P mutation test
      - uses: actions/upload-artifact@v4
        with: { name: reports-mutation, path: backend/target/pit-reports/ }

  # 取り込み: 重量ジョブが動かなかった場合もスキップを申告するため必ず実行する
  submit:
    needs: [setup, base, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: reports/, merge-multiple: true }
      # 送る成果物とスキップの申告を決める。動かなかった重量ジョブの指標はスキップとして申告する
      - name: 送信内容の決定
        id: plan
        env:
          MUTATION_RESULT: ${{ needs.mutation.result }}
          RUNNER_TYPE: ${{ needs.setup.outputs.runner_type }}
        run: |
          SKIPPED=""
          if [ "$MUTATION_RESULT" = "skipped" ]; then
            SKIPPED+=$'M-02 ミューテーションテストを実行しない設定のため\n'
          fi
          # 比較元に OpenAPI 定義が無ければ、M-09 は新規 API として申告する
          OASDIFF_META=""
          [ ! -e reports/oasdiff-base-spec-missing ] || OASDIFF_META=' metadata={"baseSpecMissing":true}'
          {
            echo "skipped<<EOF"
            printf '%s' "$SKIPPED"
            echo "EOF"
            echo "artifacts<<EOF"
            echo "jacoco-xml reports/backend/jacoco.xml component=backend"
            echo "pmd-xml reports/backend/pmd.xml component=backend"
            echo "junit-xml reports/contract/TEST-*ApiIT.xml component=backend"
            echo "lcov reports/frontend-coverage/lcov.info component=frontend"
            echo "axe-json reports/axe-results.json component=frontend"
            echo "sarif reports/trivy.sarif"
            echo "oasdiff-json reports/oasdiff.json${OASDIFF_META}"
            [ "$MUTATION_RESULT" = "skipped" ] || echo 'pit-xml reports/mutations.xml component=backend metadata={"mutationScope":"all"}'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "runnerType=$RUNNER_TYPE"
          printf 'skipped:\n%s' "$SKIPPED"

      # 判定に使う合格ラインも送る。quality-gate はチェックアウトしたそのコミットの .quality-gate.yml で判定する。
      # 失敗しても CI は止めない（quality-gate-action の fail-on-error の既定。NFR 10.3）
      - name: quality-gate へ送信
        if: vars.QG_BASE_URL != ''
        uses: ./quality-gate-action
        with:
          base-url: ${{ vars.QG_BASE_URL }}
          token: ${{ secrets.QG_INGEST_TOKEN }}
          runner-type: ${{ needs.setup.outputs.runner_type }}
          config: .quality-gate.yml
          artifacts: ${{ steps.plan.outputs.artifacts }}
          skipped-metrics: ${{ steps.plan.outputs.skipped }}
