# Pull Request の CI: quality-gate 自身のテストと検査を実行する。
#
# quality-gate 自身の指標は計測せず、quality-gate へも送らない（DD-5）。
# 合格ラインに相当する検査は、このワークフローの成否で確かめる。
#
# セルフホストランナーは収集ランナー専用（DD-11）のため使わず、GitHub ホストランナーで動かす。
# ランナーが止まっていても PR の CI は止まらない。
name: ci

on:
  pull_request:

permissions:
  contents: read

# 同じ PR に新しいコミットが来たら、古い実行は取り消す
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: バックエンドのテスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # verify フェーズまで実行し、結合テスト（*IT。Testcontainers で PostgreSQL を起動する）も動かす。
      # api/openapi.yml はこのとき再生成される。フロントエンドの同梱ビルドは行わない（frontend ジョブで検査する）
      - name: ユニットテストと結合テスト（JUnit）
        run: ./backend/mvnw -f backend/pom.xml -B -ntp verify -DskipFrontend=true
      - name: 生成物の同期検証
        run: |
          cd frontend && npm ci && npm run generate:api && cd ..
          git diff --exit-code api/ frontend/src/api/schema.d.ts \
            || { echo '::error::openapi.yml または schema.d.ts が最新ではありません。再生成してコミットしてください'; exit 1; }

  frontend:
    name: フロントエンドの検査とユニットテスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存関係の取得
        working-directory: frontend
        run: npm ci
      - name: 静的検査（ESLint / Prettier / vue-tsc）
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
      - name: ユニットテスト（Vitest）
        working-directory: frontend
        run: npm test

  accessibility:
    name: アクセシビリティ検査
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 画面はコミット済みの応答例（frontend/e2e/fixtures/）で描く。dev server は Playwright が起動する
      - name: Playwright + axe-core（ライト / ダーク）
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:a11y

  vulnerabilities:
    name: 脆弱性スキャン
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Trivy は pom の親や BOM を Maven Central から直接取りに行き、GitHub ホストランナーの IP だと
      # 429 Too Many Requests で止まる。先に Maven でローカルのリポジトリ（~/.m2）に揃え、Trivy はそれだけを読む
      - name: 依存関係の取得（Maven）
        run: ./backend/mvnw -f backend/pom.xml -B -ntp -q dependency:resolve
      # 収集ランナーの合格ライン（重大・高 0 件）と同じ基準で失敗させる。
      # 修正版の無い脆弱性は依存の更新で直せないため、ここでは止めない
      - name: Trivy（依存関係）
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
